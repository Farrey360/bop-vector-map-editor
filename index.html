<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BoP Vector Map Editor</title>
<meta name="theme-color" content="#0e0f13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0e0f13; --panel:#171920; --panel2:#1f222b; --line:#2c303b; --text:#e6e8ee; --dim:#8b91a1;
  --accent:#4da3ff; --ok:#5ec27a; --warn:#ffb84d; --danger:#ff6b6b;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:#44495a}
button:active{background:#2a2e3a}
button.on{background:var(--accent);border-color:var(--accent);color:#06121f}
button.danger{color:var(--danger)}
button:disabled{opacity:.35;cursor:default}
input[type=text],input[type=number],input[type=password],select{background:#0f1117;border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
input[type=color]{width:38px;height:32px;padding:2px;background:#0f1117;border:1px solid var(--line);border-radius:7px;flex:none}
[hidden]{display:none!important}

/* ---------- accueil ---------- */
#home{position:absolute;inset:0;overflow:auto;padding:calc(20px + var(--safe-t)) 20px 40px}
#home h1{margin:0 0 4px;font-size:22px}
#home .sub{color:var(--dim);margin-bottom:18px}
#projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;min-height:150px;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.card img{width:100%;aspect-ratio:2/1;object-fit:cover;background:#0b1a2b;display:block}
.card .meta{padding:8px 10px}
.card .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta span{color:var(--dim);font-size:12px}
.card .x{position:absolute;top:6px;right:6px;padding:0 8px;font-size:16px;line-height:24px;background:#000a;border-color:#0000}
.card.new{align-items:center;justify-content:center;text-align:center;gap:6px;padding:14px;border-style:dashed;color:var(--dim)}
.card.new .plus{font-size:34px;color:var(--accent);line-height:1}
.card.new b{color:var(--text)}

/* ---------- éditeur ---------- */
#editor{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:#0b1a2b}
#top{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(6px + var(--safe-t)) 8px 6px;background:linear-gradient(#0e0f13ee,#0e0f13bb);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:5}
#top .title{width:170px;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
#saved{color:var(--dim);font-size:12px;margin-left:auto;white-space:nowrap}
#tools{position:absolute;left:8px;top:calc(56px + var(--safe-t));display:flex;flex-direction:column;gap:6px;z-index:4}
#tools button{width:50px;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:0;background:#171920ee}
#tools button.on{background:var(--accent);border-color:var(--accent);color:#06121f}
#tools button i{font-style:normal;font-size:18px;line-height:22px}
#tools button small{font-size:10px;color:var(--dim)}
#tools button.on small{color:#06121f}
#tools hr{width:50px;border:0;border-top:1px solid var(--line);margin:2px 0}
#panel{position:absolute;right:8px;top:calc(56px + var(--safe-t));width:272px;max-height:calc(100% - 110px - var(--safe-t));overflow:auto;background:#171920f2;border:1px solid var(--line);border-radius:12px;padding:10px;z-index:4}
#panel h3{margin:0 0 8px;font-size:13px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.row label{width:74px;flex:none;color:var(--dim);font-size:12px}
.row.wrap{flex-wrap:wrap}
.row button{flex:1}
.kv{color:var(--dim);font-size:12px;margin-bottom:6px}
.terr{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.terr button{display:flex;align-items:center;gap:6px;padding:5px 7px;text-align:left}
.terr button.on{background:var(--panel2);border-color:var(--accent);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.terr b{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid #0006}
#hint{position:absolute;left:70px;bottom:calc(8px + var(--safe-b));max-width:min(560px,calc(100% - 90px));background:#171920ee;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--dim);font-size:12.5px;z-index:4;pointer-events:none}
#coords{position:absolute;right:8px;bottom:calc(8px + var(--safe-b));background:#171920ee;border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--dim);font:12px ui-monospace,Consolas,monospace;z-index:4;pointer-events:none}
#menu{position:absolute;right:8px;top:calc(50px + var(--safe-t));width:250px;background:#171920;border:1px solid var(--line);border-radius:12px;padding:8px;z-index:9;display:flex;flex-direction:column;gap:6px}
#menu button{text-align:left}
#menu label{display:flex;gap:8px;align-items:center;color:var(--text);padding:4px 6px}
#toast{position:fixed;left:50%;bottom:calc(60px + var(--safe-b));transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:8px 14px;border-radius:10px;z-index:99;max-width:90%;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
#busy{position:fixed;inset:0;background:#0e0f13dd;display:flex;align-items:center;justify-content:center;z-index:100;font-size:16px}
.sw{position:relative;width:170px;flex:none}
#sres{position:absolute;left:0;top:38px;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:12;max-height:50vh;overflow:auto}
#sres div{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#sres div:hover,#sres div.hl{background:var(--panel2)}
#sres small{color:var(--dim)}
.bgrow{border:1px solid var(--line);border-radius:8px;padding:6px 6px 0;margin-bottom:6px;cursor:pointer}
.bgrow.sel{border-color:var(--accent)}
.bgrow input[type=range],#bgPA{width:100%;accent-color:var(--accent)}
#vbar{position:fixed;left:50%;bottom:calc(60px + var(--safe-b));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;z-index:40;max-width:96%;box-shadow:0 2px 12px #0008}
#vbar[hidden]{display:none}
#vbTxt{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vgo{margin-left:8px;padding:1px 8px;font-size:.85em}
#dlg{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#dlg .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:84vh;display:flex;flex-direction:column}
#dlg .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#dlgBody{padding:10px 14px;overflow:auto}
#dlgBody details{margin-bottom:8px}
#dlgBody summary{cursor:pointer;padding:4px 0}
#dlgBody summary span{display:inline-block;min-width:30px;text-align:center;border-radius:10px;padding:0 7px;margin-right:6px;font-weight:600}
.bad{background:var(--danger);color:#1b0707}.mid{background:var(--warn);color:#241600}.good{background:var(--ok);color:#06180d}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0 4px 36px}
.chips button{padding:2px 8px;font-size:12.5px}
@media (max-width:760px){
  #panel{right:0;left:0;top:auto;bottom:0;width:auto;max-height:42%;border-radius:12px 12px 0 0}
  #hint{bottom:calc(44% + 4px)}
  #coords{display:none}
  #top .title{width:120px}
}
</style>
</head>
<body>

<div id="home" hidden>
  <h1>BoP Vector Map Editor</h1>
  <div class="sub">Carte vectorielle du monde : découpe les terres en provinces, regroupe-les en pays et régions, exporte des polygones lon/lat.</div>
  <div id="projects"></div>
</div>

<div id="editor" hidden>
  <canvas id="cv"></canvas>
  <div id="top">
    <button id="bHome" title="Projets">←</button>
    <input id="pname" class="title" type="text" aria-label="Nom du projet">
    <div class="sw"><input id="search" type="text" placeholder="Rechercher ( / )" autocomplete="off"><div id="sres" hidden></div></div>
    <div class="seg" id="views"></div>
    <button id="bUndo" title="Annuler (Ctrl+Z)">↶</button>
    <button id="bRedo" title="Rétablir (Ctrl+Y)">↷</button>
    <button id="bFit" title="Tout voir (F)">⤢</button>
    <button id="bMenu" title="Menu">☰</button>
    <span id="saved"></span>
  </div>
  <div id="tools"></div>
  <div id="panel"></div>
  <div id="hint"></div>
  <div id="coords"></div>
  <div id="menu" hidden></div>
</div>

<div id="toast"></div>
<div id="busy" hidden>Chargement…</div>
<div id="vbar" hidden><button id="vbPrev">◀ Précédent</button><span id="vbTxt"></span><button id="vbOk" title="Normal que cette province soit en plusieurs parties : la retirer de la liste (elle reviendra si ses contours sont modifiés)">✓ Valider</button><button id="vbNext">Suivant ▶</button><button id="vbList">Liste</button><button id="vbX">×</button></div>
<div id="dlg" hidden><div class="box"><div class="hd"><b id="dlgTitle">Bilan et vérifications</b><button id="dlgX">×</button></div><div id="dlgBody"></div></div></div>
<input id="file" type="file" hidden>
<input id="imgfile" type="file" accept="image/*" hidden>

<script src="core.js"></script>
<script src="ne50.js"></script>
<script src="polygon-clipping.min.js"></script>
<script>
'use strict';
const C = BopCore;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ===================================================================== données */
const TERRAINS = [
  ['plaine', '#7cb05c', 'land'], ['steppe', '#baae56', 'land'], ['forêt', '#286034', 'land'],
  ['taïga', '#2e6056', 'land'], ['colline', '#b08c58', 'land'], ['montagne', '#887666', 'land'],
  ['désert', '#eed89c', 'land'], ['marais', '#707e4c', 'land'], ['neige', '#f0f6fc', 'land'],
  ['glacier', '#a2cce6', 'land'], ['mer', '#26406e', 'sea'], ['infranchissable', '#ff36c4', 'impassable'],
  ['lac', '#cfe3f2', 'lake'],   // ajouté à la fin : les numéros existants ne bougent jamais
];
const NOT_SET = 255;
const NONE_COLOR = '#3a3e4b';

const S = {
  id: null, name: '', provs: new Map(), countries: new Map(), regions: new Map(),
  nextProv: 1, nextCountry: 1, nextRegion: 1,
  view: 'prov', tool: 'select', sel: 0, actC: 0, actR: 0, pen: 0,
  overlayCountry: true, labels: false, provAlpha: 1, newKind: 'sea', fillKind: 'land',
  bg: [], bgSel: -1,
  cam: { x: 0, y: 15, s: 3 }, undo: [], redo: [], dirty: false,
};
const G = { edges: [], geomDirty: true, asgnDirty: true, bProv: null, bCountry: null, bRegion: null, dragB: null };

/* ---------------------------------------------------------------- caches géométrie */
function pathOf(p) {
  if (p._path) return p._path;
  const path = new Path2D();
  for (const poly of p.polys) for (const r of poly) {
    path.moveTo(r[0], r[1]);
    for (let i = 2; i < r.length; i += 2) path.lineTo(r[i], r[i + 1]);
    path.closePath();
  }
  return (p._path = path);
}
function bbOf(p) {
  if (p._bb) return p._bb;
  const bb = [Infinity, Infinity, -Infinity, -Infinity];
  for (const poly of p.polys) C.ringBBox(poly[0], bb);
  return (p._bb = bb);
}
function inval(p) { if (p) { p._path = null; p._bb = null; } G.geomDirty = true; G.asgnDirty = true; need(); }
const disjoint = (a, b) => a[2] < b[0] || a[0] > b[2] || a[3] < b[1] || a[1] > b[3];

/* Arêtes uniques (non orientées) avec les deux provinces qui les bordent.
   Clé numérique entière (rapide même sur 500 000 arêtes) + vérification exacte. */
function rebuildEdges() {
  const map = new Map(), all = [];
  for (const p of S.provs.values()) for (const poly of p.polys) for (const r of poly) {
    const n = r.length / 2;
    for (let k = 0; k < n; k++) {
      const x1 = r[2 * k], y1 = r[2 * k + 1], j = (k + 1) % n, x2 = r[2 * j], y2 = r[2 * j + 1];
      let a = Math.round(x1 * 1e7), b = Math.round(y1 * 1e7), c = Math.round(x2 * 1e7), d = Math.round(y2 * 1e7);
      if (a > c || (a === c && b > d)) { let t = a; a = c; c = t; t = b; b = d; d = t; }
      let h = Math.imul(a, 0x9E3779B1) ^ Math.imul(b, 0x85EBCA6B) ^ Math.imul(c, 0xC2B2AE35) ^ Math.imul(d, 0x27D4EB2F);
      h ^= h >>> 15;
      const bucket = map.get(h);
      let e = null;
      if (bucket) {
        for (let q = 0; q < bucket.length; q++) { const f = bucket[q]; if (f.ia === a && f.ib === b && f.ic === c && f.id === d) { e = f; break; } }
      }
      if (!e) {
        e = { x1, y1, x2, y2, a: p.id, b: 0, n: 1, ia: a, ib: b, ic: c, id: d };
        all.push(e);
        if (bucket) bucket.push(e); else map.set(h, [e]);
      } else { e.n++; if (e.b === 0) e.b = p.id; }
    }
  }
  G.edges = all;
  G.geomDirty = false;
  G.asgnDirty = true;
}
function rebuildBorders() {
  const pr = new Path2D(), co = new Path2D(), re = new Path2D();
  for (const e of G.edges) {
    if (e.a === e.b) continue;
    pr.moveTo(e.x1, e.y1); pr.lineTo(e.x2, e.y2);
    if (!e.b) continue;
    const A = S.provs.get(e.a), B = S.provs.get(e.b);
    if (!A || !B) continue;
    if (A.country !== B.country) { co.moveTo(e.x1, e.y1); co.lineTo(e.x2, e.y2); }
    if (A.region !== B.region) { re.moveTo(e.x1, e.y1); re.lineTo(e.x2, e.y2); }
  }
  G.bProv = pr; G.bCountry = co; G.bRegion = re;
  G.asgnDirty = false;
}

/* ===================================================================== annuler / rétablir */
class Tx {
  constructor() { this.before = new Map(); }
  touch(p) { if (!this.before.has(p.id)) this.before.set(p.id, C.cloneProv(p)); }
  born(p) { this.before.set(p.id, null); }
  commit() {
    const ents = [];
    for (const [id, b] of this.before) {
      const cur = S.provs.get(id);
      ents.push({ id, before: b, after: cur ? C.cloneProv(cur) : null });
    }
    if (!ents.length) return false;
    S.undo.push(ents);
    if (S.undo.length > 60) S.undo.shift();
    S.redo.length = 0;
    markDirty(); syncUI();
    return true;
  }
}
function applyEnts(ents, useAfter) {
  for (const e of ents) {
    const src = useAfter ? e.after : e.before;
    if (!src) S.provs.delete(e.id); else S.provs.set(e.id, C.cloneProv(src));
  }
  G.geomDirty = G.asgnDirty = true;
  if (!S.provs.has(S.sel)) S.sel = 0;
  markDirty(); syncUI(); need();
}
function undo() { const e = S.undo.pop(); if (e) { S.redo.push(e); applyEnts(e, false); } }
function redo() { const e = S.redo.pop(); if (e) { S.undo.push(e); applyEnts(e, true); } }

/* ===================================================================== projet */
function blankState() {
  S.provs = new Map(); S.countries = new Map(); S.regions = new Map();
  S.nextProv = S.nextCountry = S.nextRegion = 1;
  S.sel = S.actC = S.actR = 0; S.undo = []; S.redo = [];
  S.bg = []; S.bgSel = -1; S.provAlpha = 1;
  S.cloudName = ''; S.cloudSha = ''; S.cloudConflict = false;
  G.geomDirty = G.asgnDirty = true;
}
const cleanRing = r => {
  const a = [];
  for (let i = 0; i < r.length; i += 2) {
    const x = Math.round(r[i] * 1e5) / 1e5, y = Math.round(r[i + 1] * 1e5) / 1e5, n = a.length;
    if (n >= 2 && a[n - 2] === x && a[n - 1] === y) continue;
    a.push(x, y);
  }
  const n = a.length;
  if (n >= 4 && a[0] === a[n - 2] && a[1] === a[n - 1]) a.length = n - 2;
  return a.length >= 6 ? a : null;
};

function addCountry(name, tag, color) {
  const id = S.nextCountry++;
  S.countries.set(id, { id, name, tag: tag || '', color: color || C.autoColor(id * 3 + 1) });
  return id;
}
function addProvince(name, polys, country) {
  const id = S.nextProv++;
  const p = { id, name, color: C.autoColor(id), country: country || 0, region: 0, terrain: NOT_SET, polys };
  S.provs.set(id, p);
  return p;
}

function loadNaturalEarth(data) {
  blankState();
  for (const c of data || window.NE_COUNTRIES) {
    const cid = addCountry(c.n, c.t);
    addProvince(c.n, c.p.map(poly => poly.map(r => r.slice())), cid);
  }
}

function loadGeoJSON(gj) {
  blankState();
  for (const f of gj.features || []) {
    const pr = f.properties || {}, g = f.geometry;
    if (!g) continue;
    const name = pr.NAME || pr.name || pr.ADMIN || pr.admin || 'Terre';
    const tag = pr.ADM0_A3 || pr.ISO_A3 || pr.iso_a3 || '';
    const polysIn = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    const polys = [];
    for (const pl of polysIn) {
      const rings = pl.map(r => cleanRing(r.flat())).filter(Boolean);
      if (rings.length && cleanRing(pl[0].flat())) polys.push(rings);
    }
    if (!polys.length) continue;
    addProvince(name, polys, addCountry(name, tag));
  }
}

function serialize() {
  return {
    format: 1, name: S.name, nextProv: S.nextProv, nextCountry: S.nextCountry, nextRegion: S.nextRegion,
    provAlpha: S.provAlpha, cloudName: S.cloudName, cloudSha: S.cloudSha,
    bg: S.bg.map(l => ({ name: l.name, src: l.src, x0: l.x0, y0: l.y0, x1: l.x1, y1: l.y1, opacity: l.opacity, visible: l.visible })),
    countries: [...S.countries.values()], regions: [...S.regions.values()],
    provinces: [...S.provs.values()].map(p => ({
      id: p.id, name: p.name, color: p.color, country: p.country, region: p.region, terrain: p.terrain, ...(p.okMulti ? { okMulti: p.okMulti } : {}),
      polys: p.polys.map(pl => pl.map(r => r.map(v => Math.round(v * 1e7) / 1e7))), // 1e-7° ≈ 1 cm : allège le fichier
    })),
  };
}
function deserialize(d) {
  blankState();
  S.name = d.name || 'Projet';
  for (const c of d.countries || []) S.countries.set(c.id, c);
  for (const r of d.regions || []) S.regions.set(r.id, r);
  for (const p of d.provinces || []) S.provs.set(p.id, C.cloneProv(p));
  S.nextProv = d.nextProv || 1; S.nextCountry = d.nextCountry || 1; S.nextRegion = d.nextRegion || 1;
  S.provAlpha = d.provAlpha || 1;
  S.cloudName = d.cloudName || ''; S.cloudSha = d.cloudSha || '';
  for (const l of d.bg || []) addBgLayer(l);
}

function addBgLayer(l) {
  const layer = { name: l.name, src: l.src, x0: l.x0, y0: l.y0, x1: l.x1, y1: l.y1, opacity: l.opacity ?? 0.6, visible: l.visible !== false, img: new Image() };
  layer.img.onload = () => need();
  layer.img.src = l.src;
  S.bg.push(layer);
  return layer;
}

/* ---------------------------------------------------------------- stockage IndexedDB */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open('bopvec', 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('meta', { keyPath: 'id' }); d.createObjectStore('data', { keyPath: 'id' }); };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req: r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  list: () => DB.db ? DB.req(DB.db.transaction('meta').objectStore('meta').getAll()) : Promise.resolve([]),
  get: id => DB.req(DB.db.transaction('data').objectStore('data').get(id)),
  put(meta, data) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(['meta', 'data'], 'readwrite');
      t.objectStore('meta').put(meta); t.objectStore('data').put({ id: meta.id, data });
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  },
  del(id) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(['meta', 'data'], 'readwrite');
      t.objectStore('meta').delete(id); t.objectStore('data').delete(id);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  },
};

let saveTimer = 0;
function markDirty() {
  S.dirty = true; setSaved('● modifié');
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 4000);
}
function setSaved(t) { const el = $('#saved'); if (el) el.textContent = t; }
async function saveNow(noCloud) {
  clearTimeout(saveTimer);
  if (!S.id || !DB.db) { setSaved(DB.db ? '' : 'stockage indisponible'); if (noCloud !== true) cloudSchedule(); return; }
  try {
    await DB.put({ id: S.id, name: S.name, updated: Date.now(), thumb: makeThumb(), nProv: S.provs.size, cloud: S.cloudName }, serialize());
    S.dirty = false; setSaved('✓ enregistré');
    if (noCloud !== true) cloudSchedule();
  } catch (e) { setSaved('⚠ échec sauvegarde'); console.error(e); }
}

/* ===================================================================== rendu */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, needDraw = false;
/* need(true) = seule la caméra a bougé : pendant un déplacement/zoom on réutilise l'image
   de la dernière vue complète (fluide même avec 500 000 sommets), puis on redessine au repos. */
let sceneDirty = true, wheelUntil = 0, idleT = 0, snap = null, snapCam = null;
function need(camOnly) {
  if (!camOnly) sceneDirty = true;
  if (!needDraw) { needDraw = true; requestAnimationFrame(draw); }
}
function blitSnapshot() {
  const r = S.cam.s / snapCam.s;
  const nx = (snapCam.x - S.cam.x) * S.cam.s + W / 2, ny = (S.cam.y - snapCam.y) * S.cam.s + H / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b1a2b'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(snap, (nx - W / 2 * r) * dpr, (ny - H / 2 * r) * dpr, W * r * dpr, H * r * dpr);
  clearTimeout(idleT);
  idleT = setTimeout(() => need(), 140);
}
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
  need();
}
const s2w = (px, py) => [(px - W / 2) / S.cam.s + S.cam.x, S.cam.y - (py - H / 2) / S.cam.s];
const w2s = (x, y) => [(x - S.cam.x) * S.cam.s + W / 2, (S.cam.y - y) * S.cam.s + H / 2];

function provFill(p) {
  switch (S.view) {
    case 'country': { const c = S.countries.get(p.country); return c ? c.color : NONE_COLOR; }
    case 'region': { const r = S.regions.get(p.region); return r ? r.color : NONE_COLOR; }
    case 'terrain': return p.terrain === NOT_SET ? NONE_COLOR : TERRAINS[p.terrain][1];
    default: return p.color;
  }
}

function renderScene(c, w, h, cam, opts) {
  const s = cam.s;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#0b1a2b'; c.fillRect(0, 0, w * opts.k, h * opts.k);
  c.setTransform(opts.k * s, 0, 0, -opts.k * s, opts.k * (w / 2 - cam.x * s), opts.k * (h / 2 + cam.y * s));
  const x0 = cam.x - w / 2 / s, x1 = cam.x + w / 2 / s, y0 = cam.y - h / 2 / s, y1 = cam.y + h / 2 / s;
  const vp = [x0, y0, x1, y1];
  const view = opts.view;
  c.lineJoin = 'round';
  if (opts.bg) {
    for (const l of S.bg) {
      if (!l.visible || !l.img.complete || !l.img.naturalWidth) continue;
      c.save(); c.globalAlpha = l.opacity;
      c.translate(l.x0, l.y1); c.scale(1, -1);
      c.drawImage(l.img, 0, 0, l.x1 - l.x0, l.y1 - l.y0);
      c.restore();
    }
  }
  const vis = [];
  for (const p of S.provs.values()) { if (!disjoint(bbOf(p), vp)) vis.push(p); }
  const fillOf = p => {
    if (view === 'country' || view === 'bg') { const q = S.countries.get(p.country); return q ? q.color : NONE_COLOR; }
    if (view === 'region') { const q = S.regions.get(p.region); return q ? q.color : NONE_COLOR; }
    if (view === 'terrain') return p.terrain === NOT_SET ? NONE_COLOR : TERRAINS[p.terrain][1];
    return p.color;
  };
  c.globalAlpha = opts.alpha === undefined ? 1 : opts.alpha;
  for (const p of vis) {
    c.fillStyle = fillOf(p);
    c.fill(pathOf(p), 'evenodd');
    if (p.polys.length > 1) { c.strokeStyle = c.fillStyle; c.lineWidth = 0.9 / s; c.stroke(pathOf(p)); }
  }
  c.globalAlpha = 1;
  if (view === 'region' && opts.overlay) {
    c.globalAlpha = 0.4;
    for (const p of vis) { const q = S.countries.get(p.country); if (!q) continue; c.fillStyle = q.color; c.fill(pathOf(p), 'evenodd'); }
    c.globalAlpha = 1;
  }
  return { vis, s };
}

function draw() {
  needDraw = false;
  if (!W) return;
  const moving = (act && act.kind === 'pan') || gesture || performance.now() < wheelUntil;
  if (moving && !sceneDirty && snap && snap.width === cv.width && snap.height === cv.height) { blitSnapshot(); return; }
  sceneDirty = false;
  const dragging = act && act.kind === 'vdrag';
  if (!dragging) {
    if (G.geomDirty) rebuildEdges();
    if (G.asgnDirty) rebuildBorders();
  }
  const { vis, s } = renderScene(ctx, W, H, S.cam, { k: dpr, view: S.view, overlay: S.overlayCountry, bg: true, alpha: S.provAlpha });
  const px = 1 / s;
  ctx.lineJoin = 'round';

  if (dragging) {
    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 0.8 * px;
    if (G.dragB) ctx.stroke(G.dragB);
    for (const id of act.provIds) { const p = S.provs.get(id); if (p) ctx.stroke(pathOf(p)); }
  } else if (G.bProv) {
    ctx.strokeStyle = S.view === 'prov' ? 'rgba(0,0,0,.6)' : 'rgba(0,0,0,.28)';
    ctx.lineWidth = (S.view === 'prov' ? 0.9 : 0.6) * px;
    ctx.stroke(G.bProv);
    if (S.view === 'region') { ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 1.3 * px; ctx.stroke(G.bRegion); }
    if (S.view === 'country' || S.view === 'region') {
      ctx.strokeStyle = S.view === 'region' ? 'rgba(255,255,255,.9)' : 'rgba(0,0,0,.9)';
      ctx.lineWidth = (S.view === 'region' ? 2 : 1.6) * px; ctx.stroke(G.bCountry);
    }
  }

  // sélection / actif
  const sp = S.provs.get(S.sel);
  if (sp && S.view === 'prov') {
    ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 2.4 * px; ctx.stroke(pathOf(sp));
  }

  // prévisualisation de découpe
  if (cut.pts.length || cut.free) {
    const pts = cut.pts.slice();
    if (cut.free) for (let i = 0; i < cut.free.length; i++) pts.push(cut.free[i]);
    else if (cut.hover) pts.push(cut.hover[0], cut.hover[1]);
    ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 2.2 * px; ctx.setLineDash([6 * px, 4 * px]);
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // prévisualisation du polygone libre
  if (pdraw.pts.length) {
    const pts = pdraw.pts.slice();
    if (pdraw.hover) pts.push(pdraw.hover[0], pdraw.hover[1]);
    ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 2.2 * px; ctx.fillStyle = 'rgba(77,210,255,.18)';
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.fill(); ctx.stroke();
  }

  // couche écran : noms, sommets
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (pdraw.pts.length) {
    ctx.fillStyle = '#4dd2ff';
    for (let i = 0; i < pdraw.pts.length; i += 2) { const [sx, sy] = w2s(pdraw.pts[i], pdraw.pts[i + 1]); ctx.beginPath(); ctx.arc(sx, sy, i === 0 ? 6 : 3.5, 0, 7); ctx.fill(); }
  }
  if (S.view === 'bg') {
    const l = S.bg[S.bgSel];
    if (l) {
      const [ax, ay] = w2s(l.x0, l.y1), [bx, by] = w2s(l.x1, l.y0);
      ctx.strokeStyle = '#4da3ff'; ctx.lineWidth = 1.5; ctx.strokeRect(ax, ay, bx - ax, by - ay);
      ctx.fillStyle = '#4da3ff';
      for (const [hx, hy] of [[ax, ay], [bx, ay], [ax, by], [bx, by]]) ctx.fillRect(hx - 6, hy - 6, 12, 12);
    }
  }
  if (S.labels) {
    ctx.font = '12px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.fillStyle = '#fff';
    for (const p of vis) {
      const bb = bbOf(p), wpx = (bb[2] - bb[0]) * s;
      if (wpx < 55) continue;
      const [cx, cy] = w2s((bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2);
      ctx.strokeText(p.name, cx, cy); ctx.fillText(p.name, cx, cy);
    }
  }
  if (S.view === 'prov' && S.tool === 'vertex' && sp) {
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    let n = 0;
    for (const poly of sp.polys) for (const r of poly) for (let i = 0; i < r.length && n < 6000; i += 2) {
      const [sx, sy] = w2s(r[i], r[i + 1]);
      if (sx < -5 || sy < -5 || sx > W + 5 || sy > H + 5) continue;
      ctx.fillRect(sx - 3, sy - 3, 6, 6); ctx.strokeRect(sx - 3, sy - 3, 6, 6); n++;
    }
  }
  if (act && act.kind === 'vdrag' && act.snap) {
    const [sx, sy] = w2s(act.snap[0], act.snap[1]);
    ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, 9, 0, 6.2832); ctx.stroke();
  }

  // instantané de la vue complète (réutilisé pendant les déplacements/zooms)
  if (!snap) snap = document.createElement('canvas');
  if (snap.width !== cv.width || snap.height !== cv.height) { snap.width = cv.width; snap.height = cv.height; }
  snap.getContext('2d').drawImage(cv, 0, 0);
  snapCam = { x: S.cam.x, y: S.cam.y, s: S.cam.s };
  if (S.view === 'prov' && S.tool === 'weld' && brush.x !== null) {
    ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 2; ctx.fillStyle = '#ff3b3b22';
    ctx.beginPath(); ctx.arc(brush.x, brush.y, brush.r, 0, 6.2832); ctx.fill(); ctx.stroke();
  }
}

function makeThumb() {
  const w = 300, h = 150, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const bb = [Infinity, Infinity, -Infinity, -Infinity];
  for (const p of S.provs.values()) { const b = bbOf(p); bb[0] = Math.min(bb[0], b[0]); bb[1] = Math.min(bb[1], b[1]); bb[2] = Math.max(bb[2], b[2]); bb[3] = Math.max(bb[3], b[3]); }
  if (!isFinite(bb[0])) return '';
  const s = Math.min(w / (bb[2] - bb[0] + 1e-6), h / (bb[3] - bb[1] + 1e-6)) * 0.96;
  renderScene(c.getContext('2d'), w, h, { x: (bb[0] + bb[2]) / 2, y: (bb[1] + bb[3]) / 2, s }, { k: 1, view: 'country', overlay: false });
  return c.toDataURL('image/jpeg', 0.6);
}

function fitView() {
  const bb = [Infinity, Infinity, -Infinity, -Infinity];
  for (const p of S.provs.values()) { const b = bbOf(p); bb[0] = Math.min(bb[0], b[0]); bb[1] = Math.min(bb[1], b[1]); bb[2] = Math.max(bb[2], b[2]); bb[3] = Math.max(bb[3], b[3]); }
  if (!isFinite(bb[0])) { bb[0] = -180; bb[1] = -90; bb[2] = 180; bb[3] = 90; }
  S.cam.x = (bb[0] + bb[2]) / 2; S.cam.y = (bb[1] + bb[3]) / 2;
  S.cam.s = Math.min(W / ((bb[2] - bb[0]) * 1.04 + 1e-6), H / ((bb[3] - bb[1]) * 1.12 + 1e-6));
  need();
}

/* ===================================================================== recherche / hit-test */
function hitProv(wx, wy) {
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (wx < bb[0] || wx > bb[2] || wy < bb[1] || wy > bb[3]) continue;
    for (const poly of p.polys) {
      const pb = C.polyBBox(poly);
      if (wx < pb[0] || wx > pb[2] || wy < pb[1] || wy > pb[3]) continue;
      if (C.pointInPoly(wx, wy, poly)) return p;
    }
  }
  return null;
}

function nextName(name) {
  const base = name.replace(/\s+\d+$/, '');
  const re = new RegExp('^' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:\\s+(\\d+))?$');
  let max = 1;
  for (const p of S.provs.values()) { const m = re.exec(p.name); if (m) max = Math.max(max, m[1] ? +m[1] : 1); }
  return base + ' ' + (max + 1);
}

/* ===================================================================== outils : découpe */
const cut = { pts: [], free: null, hover: null, down: null };
function cutReset() { cut.pts = []; cut.free = null; cut.hover = null; cut.down = null; polyReset(); need(); }
const pdraw = { pts: [], hover: null };
function polyReset() { pdraw.pts = []; pdraw.hover = null; }

function applyCut(line) {
  if (line.length < 4) { toast('Il faut au moins 2 points'); return; }
  const lb = [Infinity, Infinity, -Infinity, -Infinity];
  for (let i = 0; i < line.length; i += 2) {
    lb[0] = Math.min(lb[0], line[i]); lb[2] = Math.max(lb[2], line[i]);
    lb[1] = Math.min(lb[1], line[i + 1]); lb[3] = Math.max(lb[3], line[i + 1]);
  }
  const tx = new Tx(), newPts = [];
  let created = 0, did = false;
  for (const p of [...S.provs.values()]) {
    if (disjoint(bbOf(p), lb)) continue;
    const keep = [], extra = [];
    let changed = false;
    for (const poly of p.polys) {
      const res = disjoint(C.polyBBox(poly), lb) ? null : C.splitPoly(poly, line);
      if (!res) { keep.push(poly); continue; }
      changed = true;
      keep.push(res.polys[0]);
      for (let k = 1; k < res.polys.length; k++) extra.push(res.polys[k]);
      for (const pt of res.newPoints) newPts.push(pt);
    }
    if (!changed) continue;
    tx.touch(p);
    p.polys = keep; inval(p);
    for (const ep of extra) {
      const np = addProvince(nextName(p.name), [ep], p.country);
      np.region = p.region; np.terrain = p.terrain;
      tx.born(np); created++;
    }
    did = true;
  }
  if (!did) { toast('La ligne ne coupe aucune province (dépasse bien des deux côtés)'); return; }
  // T-jonctions : répercute les nouveaux sommets sur les voisines
  for (const pt of newPts) {
    for (const q of S.provs.values()) {
      const bb = bbOf(q);
      if (pt.x < bb[0] - 1e-7 || pt.x > bb[2] + 1e-7 || pt.y < bb[1] - 1e-7 || pt.y > bb[3] + 1e-7) continue;
      for (const poly of q.polys) for (const r of poly) {
        const k = C.edgeIndexOn(r, pt.x, pt.y);
        if (k < 0) continue;
        tx.touch(q); r.splice(2 * (k + 1), 0, pt.x, pt.y); inval(q);
      }
    }
  }
  tx.commit();
  toast(created + ' province' + (created > 1 ? 's' : '') + ' créée' + (created > 1 ? 's' : ''));
}

function cutDown(e, px, py, wx, wy, right) {
  if (right) { cut.pts.splice(-2, 2); cut.free = null; need(); return; }
  cut.down = { px, py };
  act = { kind: 'cut' };
}
function cutMove(px, py, wx, wy) {
  const d = cut.down;
  if (d && !cut.free && Math.hypot(px - d.px, py - d.py) > 7) {
    const [sx, sy] = s2w(d.px, d.py);
    cut.free = [sx, sy];
  }
  if (cut.free) {
    const n = cut.free.length;
    const [lx, ly] = w2s(cut.free[n - 2], cut.free[n - 1]);
    if (Math.hypot(px - lx, py - ly) > 2.5) cut.free.push(wx, wy);
  }
  cut.hover = [wx, wy];
  need();
}
function cutUp(px, py, wx, wy) {
  if (cut.free) {
    cut.free.push(wx, wy);
    const line = cut.pts.concat(cut.free);
    cutReset(); applyCut(line);
  } else if (cut.down) {
    // clic simple : ajoute un sommet ; double-clic (proche du précédent) termine
    const n = cut.pts.length;
    if (n >= 2) {
      const [lx, ly] = w2s(cut.pts[n - 2], cut.pts[n - 1]);
      if (Math.hypot(px - lx, py - ly) < 10) { const line = cut.pts.slice(); cutReset(); applyCut(line); return; }
    }
    cut.pts.push(wx, wy);
  }
  cut.down = null; need();
}
function cutFinish() { if (cut.pts.length >= 4) { const line = cut.pts.slice(); cutReset(); applyCut(line); } }

/* ===================================================================== outils : fusion / éclater / supprimer */
function mergeClick(wx, wy) {
  const p = hitProv(wx, wy);
  if (!p) return;
  const A = S.provs.get(S.sel);
  if (!A) { S.sel = p.id; syncUI(); need(); return; }
  if (A.id === p.id) return;
  const tx = new Tx(); tx.touch(A); tx.touch(p);
  const u = C.unionPolys(A.polys, p.polys);
  A.polys = u || A.polys.concat(p.polys);
  S.provs.delete(p.id); inval(A);
  tx.commit();
  toast(u ? 'Fusionné dans « ' + A.name + ' » (frontière commune supprimée)' : 'Fusionné dans « ' + A.name + ' » (parties conservées : contours non concordants)');
}
function explodeSel() {
  const p = S.provs.get(S.sel);
  if (!p || p.polys.length < 2) { toast('Cette province n’a qu’une seule partie'); return; }
  const tx = new Tx(); tx.touch(p);
  const extra = p.polys.slice(1);
  p.polys = [p.polys[0]]; inval(p);
  for (const poly of extra) {
    const np = addProvince(nextName(p.name), [poly], p.country);
    np.region = p.region; np.terrain = p.terrain; tx.born(np);
  }
  tx.commit(); toast(extra.length + ' provinces créées');
}
function deleteSel() {
  const p = S.provs.get(S.sel);
  if (!p) return;
  const tx = new Tx(); tx.touch(p);
  S.provs.delete(p.id); S.sel = 0; G.geomDirty = G.asgnDirty = true;
  tx.commit(); need();
}

/* ===================================================================== polygone libre / océans */
const KIND_TERRAIN = { land: NOT_SET, sea: 10, lake: 12 };
const KIND_NAME = { land: 'Terre', sea: 'Mer', lake: 'Lac' };

const seaColor = id => C.hsl(205 + (id * 13) % 28, 50, 24 + (id * 7) % 12);

function freshName(base) {
  const re = new RegExp('^' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:\\s+(\\d+))?$');
  let max = 0;
  for (const p of S.provs.values()) { const m = re.exec(p.name); if (m) max = Math.max(max, m[1] ? +m[1] : 1); }
  return base + ' ' + (max + 1);
}

function snapVertex(wx, wy) {
  const r = 10 / S.cam.s;
  let best = null, bd = r * r;
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (wx < bb[0] - r || wx > bb[2] + r || wy < bb[1] - r || wy > bb[3] + r) continue;
    for (const pl of p.polys) for (const ring of pl) for (let i = 0; i < ring.length; i += 2) {
      const dx = ring[i] - wx, dy = ring[i + 1] - wy, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = [ring[i], ring[i + 1]]; }
    }
  }
  return best;
}

function polyDown(px, py, wx, wy, right) {
  if (right) { pdraw.pts.splice(-2, 2); need(); return; }
  const sn = snapVertex(wx, wy);
  if (sn) { wx = sn[0]; wy = sn[1]; }
  const n = pdraw.pts.length;
  if (n >= 6) {
    const [fx, fy] = w2s(pdraw.pts[0], pdraw.pts[1]);
    if (Math.hypot(px - fx, py - fy) < 12) { polyFinish(); return; }
  }
  if (n >= 2) {
    const [lx, ly] = w2s(pdraw.pts[n - 2], pdraw.pts[n - 1]);
    if (Math.hypot(px - lx, py - ly) < 6) { if (n >= 6) polyFinish(); return; } // double-clic
  }
  pdraw.pts.push(wx, wy); need();
}

function polyFinish() {
  const raw = pdraw.pts.slice();
  polyReset(); need();
  const ring = [];
  for (let i = 0; i < raw.length; i += 2) {
    const n = ring.length;
    if (n >= 2 && ring[n - 2] === raw[i] && ring[n - 1] === raw[i + 1]) continue;
    ring.push(raw[i], raw[i + 1]);
  }
  if (ring.length >= 4 && ring[0] === ring[ring.length - 2] && ring[1] === ring[ring.length - 1]) ring.length -= 2;
  if (ring.length < 6) { toast('Il faut au moins 3 points'); return; }
  const n = ring.length / 2;
  for (let i = 0; i < n; i++) for (let j = i + 2; j < n; j++) {
    if (i === 0 && j === n - 1) continue;
    const i2 = (i + 1) % n, j2 = (j + 1) % n;
    if (C.segCross(ring[2 * i], ring[2 * i + 1], ring[2 * i2], ring[2 * i2 + 1], ring[2 * j], ring[2 * j + 1], ring[2 * j2], ring[2 * j2 + 1])) {
      toast('Le polygone se recoupe lui-même'); return;
    }
  }
  const bb = C.ringBBox(ring);
  for (const p of S.provs.values()) {
    if (disjoint(bbOf(p), bb)) continue;
    for (const pl of p.polys) for (const r of pl) {
      const m = r.length / 2;
      for (let k = 0; k < m; k++) {
        const k2 = (k + 1) % m;
        for (let i = 0; i < n; i++) {
          const i2 = (i + 1) % n;
          if (C.segCross(ring[2 * i], ring[2 * i + 1], ring[2 * i2], ring[2 * i2 + 1], r[2 * k], r[2 * k + 1], r[2 * k2], r[2 * k2 + 1])) {
            toast('Le polygone traverse « ' + p.name + ' » : colle-le à ses sommets ou reste dans le vide'); return;
          }
        }
      }
    }
  }
  // point intérieur (centroïde de surface, sinon barycentre des 3 premiers sommets)
  let cx = 0, cy = 0;
  for (let i = 0; i < n; i++) { cx += ring[2 * i]; cy += ring[2 * i + 1]; }
  cx /= n; cy /= n;
  if (!C.pointInRing(cx, cy, ring)) { cx = (ring[0] + ring[2] + ring[4]) / 3; cy = (ring[1] + ring[3] + ring[5]) / 3; }
  let host = null;
  for (const p of S.provs.values()) {
    const b = bbOf(p);
    if (cx < b[0] || cx > b[2] || cy < b[1] || cy > b[3]) continue;
    for (const pl of p.polys) if (C.pointInPoly(cx, cy, pl)) { host = { p, pl }; break; }
    if (host) break;
  }
  const kind = S.newKind, tx = new Tx();
  if (host) { tx.touch(host.p); host.pl.push(C.orientRing(ring, false)); inval(host.p); }
  const np = addProvince(freshName(KIND_NAME[kind]), [[C.orientRing(ring, true)]], 0);
  np.terrain = KIND_TERRAIN[kind]; tx.born(np);
  if (kind === 'sea') np.color = seaColor(np.id); else if (kind === 'lake') np.color = '#cfe3f2';
  // sommets posés sur l'arête d'une voisine : on les y insère (pas de T-jonction)
  for (let i = 0; i < n; i++) {
    for (const q of S.provs.values()) {
      if (q === np) continue;
      const b = bbOf(q), x = ring[2 * i], y = ring[2 * i + 1];
      if (x < b[0] - 1e-7 || x > b[2] + 1e-7 || y < b[1] - 1e-7 || y > b[3] + 1e-7) continue;
      for (const pl of q.polys) for (const r of pl) {
        const k = C.edgeIndexOn(r, x, y);
        if (k < 0) continue;
        tx.touch(q); r.splice(2 * (k + 1), 0, x, y); inval(q);
      }
    }
  }
  S.sel = np.id; inval(np);
  tx.commit();
  toast(host ? KIND_NAME[kind] + ' créé (trou découpé dans « ' + host.p.name + ' »)' : KIND_NAME[kind] + ' créé');
}

/* Outil « Remplir » : un clic dans une zone vide (entre des provinces) crée une province qui épouse exactement le vide.
   Fenêtre locale (rect − provinces voisines), agrandie tant que la zone touche le bord de la fenêtre. */
function fillDown(wx, wy) {
  if (!window.polygonClipping) { toast('Bibliothèque de découpe absente (polygon-clipping.min.js)'); return; }
  if (hitProv(wx, wy)) { toast('Clique dans une zone vide (entre les provinces)'); return; }
  const pc = window.polygonClipping;
  const toG = poly => poly.map(r => { const a = []; for (let i = 0; i < r.length; i += 2) a.push([r[i], r[i + 1]]); a.push([r[0], r[1]]); return a; });
  const ringOf = r => {   // anneau fermé [[x,y]..] -> plat, sans arrondi (garde les sommets communs exacts)
    const a = [];
    for (const [x, y] of r) { const n = a.length; if (n >= 2 && a[n - 2] === x && a[n - 1] === y) continue; a.push(x, y); }
    if (a.length >= 4 && a[0] === a[a.length - 2] && a[1] === a[a.length - 1]) a.length -= 2;
    return a.length >= 6 ? a : null;
  };
  let h = 0.25, piece = null;
  try {
    for (;;) {
      const rect = [Math.max(-180, wx - h), Math.max(-90, wy - h), Math.min(180, wx + h), Math.min(90, wy + h)];
      const clips = [];
      for (const p of S.provs.values()) { if (disjoint(bbOf(p), rect)) continue; for (const pl of p.polys) clips.push(toG(pl)); }
      const R = [[[rect[0], rect[1]], [rect[2], rect[1]], [rect[2], rect[3]], [rect[0], rect[3]], [rect[0], rect[1]]]];
      const res = clips.length ? pc.difference(R, ...clips) : [R];
      let pick = null;
      for (const pl of res) {
        const rings = pl.map(r => ringOf(r)).filter(Boolean);
        if (rings.length && ringOf(pl[0]) && C.pointInPoly(wx, wy, rings)) { pick = rings; break; }
      }
      if (!pick) { toast('Aucune zone vide à cet endroit'); return; }
      const bb = C.ringBBox(pick[0]), e = 1e-9;
      const worldAll = rect[0] <= -180 && rect[2] >= 180 && rect[1] <= -90 && rect[3] >= 90;
      const touches = (bb[0] <= rect[0] + e && rect[0] > -180) || (bb[2] >= rect[2] - e && rect[2] < 180)
        || (bb[1] <= rect[1] + e && rect[1] > -90) || (bb[3] >= rect[3] - e && rect[3] < 90);
      if (!touches || worldAll) { piece = pick; break; }
      h *= 2;
    }
  } catch (err) { toast('Échec du remplissage : ' + err.message); return; }
  if (C.polysArea([piece]) < 1e-9) { toast('Zone trop petite'); return; }
  const kind = S.fillKind, tx = new Tx();
  const np = addProvince(freshName(kind === 'land' ? 'Province' : KIND_NAME[kind]), [piece.map((r, i) => C.orientRing(r, i === 0))], 0);
  np.terrain = KIND_TERRAIN[kind]; tx.born(np);
  if (kind === 'sea') np.color = seaColor(np.id); else if (kind === 'lake') np.color = '#cfe3f2';
  S.sel = np.id; tx.commit(); G.geomDirty = G.asgnDirty = true; need(); syncUI();
  toast((kind === 'land' ? 'Province' : KIND_NAME[kind]) + ' créée : ' + piece[0].length / 2 + ' sommets' + (piece.length > 1 ? ', ' + (piece.length - 1) + ' trou(s)' : ''));
}

function generateOcean() {
  const all = [];
  for (const p of S.provs.values()) for (const pl of p.polys) all.push(pl);
  if (!all.length) return;
  const comp = C.complementPolys([-180, -90, 180, 90], all);
  if (!comp) { toast('Génération impossible : des contours ne se referment pas (frontières non concordantes)'); return; }
  const pieces = comp.filter(pl => C.polysArea([pl]) > 1e-6).sort((a, b) => C.polysArea([b]) - C.polysArea([a]));
  if (!pieces.length) { toast('Rien à générer : la carte est déjà entièrement couverte'); return; }
  const tx = new Tx();
  pieces.forEach((pl, i) => {
    const np = addProvince(i === 0 ? freshName('Océan') : freshName('Mer'), [pl], 0);
    np.terrain = 10; np.color = seaColor(np.id); tx.born(np);
  });
  tx.commit(); G.geomDirty = G.asgnDirty = true; need();
  toast(pieces.length + ' zone' + (pieces.length > 1 ? 's' : '') + ' maritime' + (pieces.length > 1 ? 's' : '') + ' générée' + (pieces.length > 1 ? 's' : '') + ' — découpe-les ensuite avec l’outil Découpe');
}

/* Ajoute les terres Natural Earth absentes du projet (ex. projet converti d'une carte raster partielle).
   Terres NE − provinces existantes ; les éclats plus petits que MIN_AREA (°²) sont ignorés. */
async function completeWithNE() {
  if (!window.polygonClipping) { toast('Bibliothèque de découpe absente (polygon-clipping.min.js)'); return; }
  const MIN_AREA = 0.02;
  busy(true, 'Ajout des terres Natural Earth…');
  await new Promise(r => setTimeout(r, 30));
  try {
    const pc = window.polygonClipping;
    const toG = poly => poly.map(r => { const a = []; for (let i = 0; i < r.length; i += 2) a.push([r[i], r[i + 1]]); a.push([r[0], r[1]]); return a; });
    const bbG = g => {
      const b = [Infinity, Infinity, -Infinity, -Infinity];
      for (const pl of g) for (const q of pl[0]) { b[0] = Math.min(b[0], q[0]); b[2] = Math.max(b[2], q[0]); b[1] = Math.min(b[1], q[1]); b[3] = Math.max(b[3], q[1]); }
      return b;
    };
    const exist = [];
    for (const p of S.provs.values()) { const g = p.polys.map(toG); exist.push({ g, bb: bbOf(p) }); }
    const byTag = new Map();
    for (const c of S.countries.values()) if (c.tag) byTag.set(c.tag, c.id);
    const tx = new Tx();
    let pieces = 0, dropped = 0, nCountries = 0;
    for (const c of window.NE_COUNTRIES) {
      const g = c.p.map(toG), bb = bbG(g);
      const clips = [];
      for (const e of exist) if (!disjoint(e.bb, bb)) for (const pl of e.g) clips.push(pl);
      let res;
      try { res = clips.length ? pc.difference(g, ...clips) : g; } catch (err) { continue; }
      const keep = [];
      for (const pl of res) {
        const rings = pl.map(r => cleanRing(r.flat())).filter(Boolean);
        if (!rings.length || !cleanRing(pl[0].flat())) continue;
        if (C.polysArea([rings]) < MIN_AREA) { dropped++; continue; }
        keep.push(rings.map((r, i) => C.orientRing(r, i === 0)));
      }
      if (!keep.length) continue;
      let cid = c.t && byTag.get(c.t);
      if (!cid) { cid = addCountry(c.n, c.t); if (c.t) byTag.set(c.t, cid); }
      nCountries++;
      for (const poly of keep) { const np = addProvince(freshName(c.n), [poly], cid); tx.born(np); pieces++; }
    }
    tx.commit(); G.geomDirty = G.asgnDirty = true; need();
    toast(pieces ? pieces + ' provinces ajoutées (' + nCountries + ' pays) ; ' + dropped + ' éclats < ' + MIN_AREA + '° ignorés' : 'Rien à ajouter : tout est déjà couvert');
  } catch (err) {
    toast('Échec : ' + err.message);
  } finally { busy(false); }
}

/* ===================================================================== fonds de référence */
function bgHit(px, py, wx, wy) {
  const l = S.bg[S.bgSel];
  if (!l) return;
  const [ax, ay] = w2s(l.x0, l.y1), [bx, by] = w2s(l.x1, l.y0);
  const corners = [[ax, ay, 'l', 't'], [bx, ay, 'r', 't'], [ax, by, 'l', 'b'], [bx, by, 'r', 'b']];
  for (const [cx, cy, hx, vy] of corners) {
    if (Math.hypot(px - cx, py - cy) < 14) { act = { kind: 'bgresize', l, hx, vy, ratio: (l.y1 - l.y0) / (l.x1 - l.x0) }; return; }
  }
  if (wx >= l.x0 && wx <= l.x1 && wy >= l.y0 && wy <= l.y1) act = { kind: 'bgmove', l, lx: wx, ly: wy };
}
function bgMove(wx, wy) {
  const a = act, l = a.l;
  if (a.kind === 'bgmove') {
    const dx = wx - a.lx, dy = wy - a.ly;
    l.x0 += dx; l.x1 += dx; l.y0 += dy; l.y1 += dy; a.lx = wx; a.ly = wy;
  } else {
    const ax = a.hx === 'l' ? l.x1 : l.x0, ay = a.vy === 't' ? l.y0 : l.y1;
    const w = Math.max(Math.abs(wx - ax), 0.01), h = w * a.ratio;
    if (a.hx === 'l') { l.x0 = ax - w; l.x1 = ax; } else { l.x0 = ax; l.x1 = ax + w; }
    if (a.vy === 't') { l.y0 = ay; l.y1 = ay + h; } else { l.y0 = ay - h; l.y1 = ay; }
  }
  need();
}
function addBgFromFile(file) {
  if (S.bg.length >= 3) { toast('3 fonds maximum'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const src = rd.result, img = new Image();
    img.onload = () => {
      const w = 360, h = w * img.naturalHeight / img.naturalWidth;
      const l = addBgLayer({ name: file.name.replace(/\.\w+$/, ''), src, x0: -180, x1: 180, y0: -h / 2, y1: h / 2, opacity: 0.6, visible: true });
      S.bgSel = S.bg.indexOf(l);
      markDirty(); syncUI(); need();
    };
    img.onerror = () => toast('Image illisible');
    img.src = src;
  };
  rd.readAsDataURL(file);
}

/* ===================================================================== recherche / bilan / renommage */
function zoomTo(bb) {
  const w = Math.max(bb[2] - bb[0], 0.02), h = Math.max(bb[3] - bb[1], 0.02);
  S.cam.x = (bb[0] + bb[2]) / 2; S.cam.y = (bb[1] + bb[3]) / 2;
  S.cam.s = clampS(Math.min(4000, W * 0.6 / w, H * 0.6 / h));
  need();
}
function gotoProv(id) {
  const p = S.provs.get(id);
  if (!p) return;
  if (S.view !== 'prov') setView('prov');
  S.sel = id; zoomTo(bbOf(p)); syncUI();
}
function gotoCountry(id) {
  const bb = [Infinity, Infinity, -Infinity, -Infinity];
  for (const p of S.provs.values()) if (p.country === id) { const b = bbOf(p); bb[0] = Math.min(bb[0], b[0]); bb[1] = Math.min(bb[1], b[1]); bb[2] = Math.max(bb[2], b[2]); bb[3] = Math.max(bb[3], b[3]); }
  setView('country'); S.actC = id;
  if (isFinite(bb[0])) zoomTo(bb);
  syncUI();
}

function searchResults(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const out = [];
  for (const c of S.countries.values()) if (c.name.toLowerCase().includes(q) || (c.tag || '').toLowerCase() === q) out.push({ k: 'c', id: c.id, t: c.name, s: 'pays' });
  for (const p of S.provs.values()) if (p.name.toLowerCase().includes(q)) out.push({ k: 'p', id: p.id, t: p.name, s: 'province #' + p.id });
  return out.slice(0, 12);
}
function pickResult(r) {
  $('#sres').hidden = true; $('#search').value = ''; $('#search').blur();
  if (r.k === 'p') gotoProv(r.id); else gotoCountry(r.id);
}

function terrType(p) { return p.terrain === NOT_SET ? 'land' : TERRAINS[p.terrain][2]; }

/* signature de la géométrie : une province validée « en plusieurs parties » réapparaît si ses contours changent */
function multiSig(p) {
  let h = 2166136261 >>> 0;
  for (const poly of p.polys) for (const r of poly) { h = Math.imul(h ^ r.length, 16777619) >>> 0; for (const v of r) h = Math.imul(h ^ (Math.round(v * 1e6) | 0), 16777619) >>> 0; }
  return p.polys.length + ':' + h.toString(36);
}
function vValidate() {
  const p = V.curK === 'p' ? S.provs.get(V.curId) : null;
  if (!p || !bilan()[V.cat].valid) return;
  const tx = new Tx(); tx.touch(p); p.okMulti = multiSig(p); tx.commit(); need();
  vStep(1);
}

function bilan() {
  const lands = [...S.provs.values()].filter(p => terrType(p) === 'land');
  const all = [...S.provs.values()];
  const names = new Map();
  for (const p of all) names.set(p.name, (names.get(p.name) || 0) + 1);
  const usedC = new Set(all.map(p => p.country)), usedR = new Set(all.map(p => p.region));
  const hasRegions = S.regions.size > 0;
  const item = p => ({ k: 'p', id: p.id, t: p.name });
  return [
    { t: 'Terres sans pays', warn: true, items: lands.filter(p => !p.country).map(item) },
    { t: 'Terres sans région', warn: hasRegions, items: hasRegions ? lands.filter(p => !p.region).map(item) : [] },
    { t: 'Provinces sans terrain défini', warn: true, items: all.filter(p => p.terrain === NOT_SET).map(item) },
    { t: 'Mers/infranchissables rattachées à un pays', warn: true, items: all.filter(p => terrType(p) !== 'land' && p.country).map(item) },
    { t: 'Noms en double', warn: true, items: all.filter(p => names.get(p.name) > 1).map(item) },
    { t: 'Très petites provinces (< 0,002 °²)', warn: false, items: all.filter(p => C.polysArea(p.polys) < 0.002).map(item) },
    { t: 'Provinces en plusieurs parties', warn: false, valid: true, items: all.filter(p => p.polys.length > 1 && p.okMulti !== multiSig(p)).map(item) },
    { t: 'Pays vides', warn: false, items: [...S.countries.values()].filter(c => !usedC.has(c.id)).map(c => ({ k: 'cn', id: c.id, t: c.name })) },
    { t: 'Régions vides', warn: false, items: [...S.regions.values()].filter(r => !usedR.has(r.id)).map(r => ({ k: 'rg', id: r.id, t: r.name })) },
  ];
}

function gotoItem(it) {
  if (it.k === 'p') gotoProv(it.id);
  else if (it.k === 'cn') { setView('country'); S.actC = it.id; syncUI(); }
  else { setView('region'); S.actR = it.id; syncUI(); }
}

/* mode « vérification » : barre précédent/suivant qui enchaîne les éléments d'une catégorie du bilan.
   La liste est recalculée à chaque pas : un élément corrigé disparaît tout seul. */
const V = { cat: -1, pos: 0, curId: null, curK: null };
function vItems() { const c = bilan()[V.cat]; return c ? c.items : []; }
function vShow() {
  const cat = bilan()[V.cat], items = cat ? cat.items : [];
  if (!items.length) { vStop(); toast('Terminé : plus rien dans « ' + (cat ? cat.t : '') + ' »'); return; }
  V.pos = Math.max(0, Math.min(V.pos, items.length - 1));
  const it = items[V.pos];
  V.curId = it.id; V.curK = it.k;
  gotoItem(it);
  $('#vbTxt').textContent = cat.t + ' — ' + (V.pos + 1) + ' / ' + items.length + ' : ' + it.t;
  $('#vbOk').hidden = !cat.valid;
  $('#vbar').hidden = false;
}
function vStart(cat, pos) { V.cat = cat; V.pos = pos || 0; $('#dlg').hidden = true; vShow(); }
function vStop() { V.cat = -1; $('#vbar').hidden = true; }
function vStep(dir) {
  if (V.cat < 0) return;
  const items = vItems();
  const still = items[V.pos] && items[V.pos].id === V.curId && items[V.pos].k === V.curK;
  // élément courant toujours présent : on avance d'un cran ; corrigé (disparu) : le suivant a pris sa place
  V.pos += dir > 0 ? (still ? 1 : 0) : -1;
  if (V.pos >= items.length) { vStop(); toast('Fin de la liste'); return; }
  if (V.pos < 0) V.pos = 0;
  vShow();
}

function showBilan() {
  $('#dlgTitle').textContent = 'Bilan et vérifications';
  const cats = bilan(), body = $('#dlgBody');
  const total = S.provs.size;
  body.innerHTML = `<div class="kv">${total} provinces · ${S.countries.size} pays · ${S.regions.size} régions</div>`
    + cats.map((c, i) => `<details ${c.items.length && c.warn ? 'open' : ''}><summary><span class="${c.items.length ? (c.warn ? 'bad' : 'mid') : 'good'}">${c.items.length ? c.items.length : '✓'}</span> ${esc(c.t)}${c.items.length ? ` <button class="vgo" data-go="${i}">Vérifier ▶</button>` : ''}</summary>
      <div class="chips">${c.items.slice(0, 80).map((it, j) => `<button data-c="${i}" data-j="${j}">${esc(it.t)}</button>`).join('')}${c.items.length > 80 ? `<span class="kv">… +${c.items.length - 80}</span>` : ''}</div></details>`).join('');
  for (const b of body.querySelectorAll('button[data-c]')) b.onclick = () => vStart(+b.dataset.c, +b.dataset.j);
  for (const b of body.querySelectorAll('button[data-go]')) b.onclick = e => { e.preventDefault(); e.stopPropagation(); vStart(+b.dataset.go, 0); };
  $('#dlg').hidden = false;
}

function renameBatch(kind, id) {
  const holder = kind === 'country' ? S.countries.get(id) : S.regions.get(id);
  if (!holder) return;
  const ps = [...S.provs.values()].filter(p => (kind === 'country' ? p.country : p.region) === id)
    .sort((a, b) => { const A = bbOf(a), B = bbOf(b); return (B[3] + B[1]) - (A[3] + A[1]) || (A[0] + A[2]) - (B[0] + B[2]); });
  if (!ps.length) { toast('Aucune province'); return; }
  const tx = new Tx();
  ps.forEach((p, i) => { tx.touch(p); p.name = ps.length === 1 ? holder.name : holder.name + ' ' + (i + 1); });
  tx.commit(); G.asgnDirty = true; need();
  toast(ps.length + (ps.length > 1 ? ' provinces renommées (du nord au sud)' : ' province renommée'));
}

/* ===================================================================== outils : sommets */
function forEachRing(cb) { for (const p of S.provs.values()) for (const poly of p.polys) for (const r of poly) cb(p, r); }

function collectRefs(x, y) {
  const refs = [], eps = 1e-9;
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (x < bb[0] - eps || x > bb[2] + eps || y < bb[1] - eps || y > bb[3] + eps) continue;
    for (const poly of p.polys) for (const r of poly) {
      for (let i = 0; i < r.length; i += 2) if (Math.abs(r[i] - x) < eps && Math.abs(r[i + 1] - y) < eps) refs.push({ p, r, i });
    }
  }
  return refs;
}

function startVertexDrag(refs) {
  const tx = new Tx(), ids = new Set();
  for (const f of refs) { tx.touch(f.p); ids.add(f.p.id); }
  const b = new Path2D();
  for (const e of G.edges) { if (ids.has(e.a) || ids.has(e.b)) continue; b.moveTo(e.x1, e.y1); b.lineTo(e.x2, e.y2); }
  G.dragB = b;
  act = { kind: 'vdrag', refs, tx, provIds: ids, moved: false };
  need();
}

function vertexDown(e, px, py, wx, wy, right) {
  const r = 10 / S.cam.s;
  let best = null, bd = r * r;
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (wx < bb[0] - r || wx > bb[2] + r || wy < bb[1] - r || wy > bb[3] + r) continue;
    for (const poly of p.polys) for (const ring of poly) for (let i = 0; i < ring.length; i += 2) {
      const dx = ring[i] - wx, dy = ring[i + 1] - wy, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = [ring[i], ring[i + 1]]; }
    }
  }
  if (best) {
    const refs = collectRefs(best[0], best[1]);
    if (right) deleteVertices(refs); else startVertexDrag(refs);
    return;
  }
  if (right) return;
  // arête de la province sélectionnée -> nouveau sommet
  const sp = S.provs.get(S.sel);
  if (sp) {
    let eb = null, ed = r;
    for (const poly of sp.polys) for (const ring of poly) {
      const n = ring.length / 2;
      for (let k = 0; k < n; k++) {
        const ax = ring[2 * k], ay = ring[2 * k + 1], j = (k + 1) % n, bx = ring[2 * j], by = ring[2 * j + 1];
        const ex = bx - ax, ey = by - ay, l2 = ex * ex + ey * ey;
        if (!l2) continue;
        const t = Math.max(0, Math.min(1, ((wx - ax) * ex + (wy - ay) * ey) / l2));
        const qx = ax + t * ex, qy = ay + t * ey, d = Math.hypot(wx - qx, wy - qy);
        if (d < ed && t > 0 && t < 1) { ed = d; eb = { ax, ay, bx, by, qx, qy }; }
      }
    }
    if (eb) { insertVertexShared(eb); return; }
  }
  const p = hitProv(wx, wy);
  S.sel = p ? p.id : 0; syncUI(); need();
}

// sommet le plus proche du curseur, en ignorant les sommets en cours de déplacement
function snapExcluding(wx, wy, refs) {
  const r = 10 / S.cam.s;
  const skip = new Map();
  for (const f of refs) { if (!skip.has(f.r)) skip.set(f.r, new Set()); skip.get(f.r).add(f.i); }
  let best = null, bd = r * r;
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (wx < bb[0] - r || wx > bb[2] + r || wy < bb[1] - r || wy > bb[3] + r) continue;
    for (const pl of p.polys) for (const ring of pl) {
      const sk = skip.get(ring);
      for (let i = 0; i < ring.length; i += 2) {
        if (sk && sk.has(i)) continue;
        const dx = ring[i] - wx, dy = ring[i + 1] - wy, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = [ring[i], ring[i + 1]]; }
      }
    }
  }
  return best;
}

// retire les doublons consécutifs (sommets fusionnés voisins dans un même contour)
function dedupeRings(ids) {
  for (const id of ids) {
    const p = S.provs.get(id); if (!p) continue;
    for (const poly of p.polys) for (const r of poly) {
      for (let i = r.length - 2; i >= 0 && r.length > 6; i -= 2) {
        const j = i === 0 ? r.length - 2 : i - 2;
        if (j !== i && Math.abs(r[i] - r[j]) < 1e-9 && Math.abs(r[i + 1] - r[j + 1]) < 1e-9) r.splice(i, 2);
      }
    }
    inval(p);
  }
}

function insertVertexShared(eb) {
  const tx = new Tx(), refs = [];
  const same = (x, y, u, v) => Math.abs(x - u) < 1e-9 && Math.abs(y - v) < 1e-9;
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (disjoint(bb, [Math.min(eb.ax, eb.bx) - 1e-9, Math.min(eb.ay, eb.by) - 1e-9, Math.max(eb.ax, eb.bx) + 1e-9, Math.max(eb.ay, eb.by) + 1e-9])) continue;
    for (const poly of p.polys) for (const r of poly) {
      const n = r.length / 2;
      for (let k = 0; k < n; k++) {
        const j = (k + 1) % n;
        const fw = same(r[2 * k], r[2 * k + 1], eb.ax, eb.ay) && same(r[2 * j], r[2 * j + 1], eb.bx, eb.by);
        const bw = same(r[2 * k], r[2 * k + 1], eb.bx, eb.by) && same(r[2 * j], r[2 * j + 1], eb.ax, eb.ay);
        if (!fw && !bw) continue;
        tx.touch(p); r.splice(2 * (k + 1), 0, eb.qx, eb.qy); inval(p);
        refs.push({ p, r, i: 2 * (k + 1) });
        break;
      }
    }
  }
  if (!refs.length) return;
  const ids = new Set(refs.map(f => f.p.id));
  const b = new Path2D();
  for (const e of G.edges) { if (ids.has(e.a) || ids.has(e.b)) continue; b.moveTo(e.x1, e.y1); b.lineTo(e.x2, e.y2); }
  G.dragB = b;
  act = { kind: 'vdrag', refs, tx, provIds: ids, moved: true };
  need();
}

function deleteVertices(refs) {
  const tx = new Tx();
  const byRing = new Map();
  for (const f of refs) { if (!byRing.has(f.r)) byRing.set(f.r, { p: f.p, idx: [] }); byRing.get(f.r).idx.push(f.i); }
  let n = 0;
  for (const [r, o] of byRing) {
    if (r.length / 2 <= 3) continue;
    tx.touch(o.p);
    for (const i of o.idx.sort((a, b) => b - a)) r.splice(i, 2);
    inval(o.p); n++;
  }
  if (n) tx.commit(); else toast('Sommet nécessaire (3 minimum)');
}

/* pinceau de fusion : tous les sommets sous le cercle sont fondus en un seul (barycentre).
   Un contour qui s'effondrerait (moins de 3 sommets restants) est épargné. */
const brush = { r: 18, x: null, y: null };   // rayon en pixels écran
function weldAt(wx, wy, tx) {
  const r = brush.r / S.cam.s, r2 = r * r;
  const key = (x, y) => Math.round(x * 1e8) + ',' + Math.round(y * 1e8);
  const hits = [];
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (wx < bb[0] - r || wx > bb[2] + r || wy < bb[1] - r || wy > bb[3] + r) continue;
    for (const poly of p.polys) for (const ring of poly) {
      const idx = [];
      for (let i = 0; i < ring.length; i += 2) { const dx = ring[i] - wx, dy = ring[i + 1] - wy; if (dx * dx + dy * dy <= r2) idx.push(i); }
      if (idx.length) hits.push({ p, ring, idx });
    }
  }
  const prot = new Set();
  for (const h of hits) if (h.ring.length / 2 - h.idx.length < 2) for (const i of h.idx) prot.add(key(h.ring[i], h.ring[i + 1]));
  const pos = new Map();
  for (const h of hits) for (const i of h.idx) { const k = key(h.ring[i], h.ring[i + 1]); if (!prot.has(k) && !pos.has(k)) pos.set(k, [h.ring[i], h.ring[i + 1]]); }
  if (pos.size < 2) return 0;
  let sx = 0, sy = 0;
  for (const [x, y] of pos.values()) { sx += x; sy += y; }
  const tx_ = sx / pos.size, ty_ = sy / pos.size, ids = new Set();
  for (const h of hits) {
    let touched = false;
    for (const i of h.idx) {
      if (prot.has(key(h.ring[i], h.ring[i + 1]))) continue;
      if (!touched) { tx.touch(h.p); touched = true; }
      h.ring[i] = tx_; h.ring[i + 1] = ty_;
    }
    if (touched) ids.add(h.p.id);
  }
  dedupeRings(ids);
  return pos.size;
}
function weldDown(wx, wy) {
  act = { kind: 'weld', tx: new Tx(), n: 0, lx: wx, ly: wy };
  act.n += weldAt(wx, wy, act.tx);
}
function weldMove(wx, wy) {
  if (Math.hypot(wx - act.lx, wy - act.ly) * S.cam.s < brush.r * 0.4) return;
  act.lx = wx; act.ly = wy;
  act.n += weldAt(wx, wy, act.tx);
}

/* ===================================================================== outils : assignation / pipette / terrain */
function paintApply(p, right) {
  const t = act.tx;
  let changed = false;
  if (S.view === 'country') {
    const v = right ? 0 : S.actC;
    if (!right && !S.actC) { toast('Choisis d’abord un pays'); return; }
    if (p.country !== v) { t.touch(p); p.country = v; changed = true; }
  } else if (S.view === 'region') {
    const v = right ? 0 : S.actR;
    if (!right && !S.actR) { toast('Crée ou choisis d’abord une région'); return; }
    if (p.region !== v) { t.touch(p); p.region = v; changed = true; }
  } else if (S.view === 'terrain') {
    const v = right ? NOT_SET : S.pen;
    if (p.terrain !== v) { t.touch(p); p.terrain = v; changed = true; }
  }
  if (changed) { G.asgnDirty = true; act.changed = true; need(); }
}
function paintDown(e, px, py, wx, wy, right) {
  act = { kind: 'paint', tx: new Tx(), right, changed: false };
  const p = hitProv(wx, wy);
  if (p) paintApply(p, right);
}
function paintMove(wx, wy) {
  const p = hitProv(wx, wy);
  if (p) paintApply(p, act.right);
}
function pipetteAt(wx, wy) {
  const p = hitProv(wx, wy);
  if (!p) return;
  if (S.view === 'country' && p.country) S.actC = p.country;
  else if (S.view === 'region' && p.region) S.actR = p.region;
  else if (S.view === 'terrain' && p.terrain !== NOT_SET) S.pen = p.terrain;
  syncUI();
}

/* ===================================================================== entrées pointeur */
let act = null, spaceDown = false, lastPen = 0, gesture = null;
const ptrs = new Map();

function toolDown(e, px, py) {
  const [wx, wy] = s2w(px, py), right = e.button === 2;
  if (S.view === 'bg') { if (S.tool === 'bgmove') bgHit(px, py, wx, wy); return; }
  if (S.view === 'prov') {
    if (S.tool === 'select') { const p = hitProv(wx, wy); S.sel = p ? p.id : 0; syncUI(); need(); }
    else if (S.tool === 'poly') polyDown(px, py, wx, wy, right);
    else if (S.tool === 'cut') cutDown(e, px, py, wx, wy, right);
    else if (S.tool === 'merge') mergeClick(wx, wy);
    else if (S.tool === 'fill' && !right) fillDown(wx, wy);
    else if (S.tool === 'vertex') vertexDown(e, px, py, wx, wy, right);
    else if (S.tool === 'weld' && !right) weldDown(wx, wy);
  } else if (S.tool === 'pipette') pipetteAt(wx, wy);
  else paintDown(e, px, py, wx, wy, right);
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (e.pointerType === 'pen') lastPen = performance.now();
  if (e.pointerType === 'touch' && performance.now() - lastPen < 2500) return; // paume
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* pointeur synthétique */ }
  ptrs.set(e.pointerId, { x: px, y: py, type: e.pointerType });
  const touches = [...ptrs.values()].filter(p => p.type === 'touch');
  if (touches.length >= 2) {
    abortAct();
    const [a, b] = touches, d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    gesture = { d0: d, s0: S.cam.s, g: s2w(cx, cy) };
    return;
  }
  if (e.button === 1 || spaceDown || S.tool === 'hand') { act = { kind: 'pan', lx: px, ly: py }; cv.style.cursor = 'grabbing'; return; }
  toolDown(e, px, py);
});

cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const [wx, wy] = s2w(px, py);
  $('#coords').textContent = wx.toFixed(3) + '°  ' + wy.toFixed(3) + '°';
  const pt = ptrs.get(e.pointerId);
  if (pt) { pt.x = px; pt.y = py; }
  if (gesture) {
    const t = [...ptrs.values()].filter(p => p.type === 'touch');
    if (t.length >= 2) {
      const d = Math.hypot(t[0].x - t[1].x, t[0].y - t[1].y) || 1;
      const cx = (t[0].x + t[1].x) / 2, cy = (t[0].y + t[1].y) / 2;
      S.cam.s = clampS(gesture.s0 * d / gesture.d0);
      S.cam.x = gesture.g[0] - (cx - W / 2) / S.cam.s;
      S.cam.y = gesture.g[1] + (cy - H / 2) / S.cam.s;
      need(true);
    }
    return;
  }
  if (S.tool === 'weld' && S.view === 'prov') { brush.x = px; brush.y = py; if (!act) need(); }
  if (!act) {
    if (S.tool === 'cut' && S.view === 'prov' && cut.pts.length) { cut.hover = [wx, wy]; need(); }
    else if (S.tool === 'poly' && S.view === 'prov' && pdraw.pts.length) { pdraw.hover = snapVertex(wx, wy) || [wx, wy]; need(); }
    return;
  }
  switch (act.kind) {
    case 'bgmove': case 'bgresize': bgMove(wx, wy); break;
    case 'pan':
      S.cam.x -= (px - act.lx) / S.cam.s; S.cam.y += (py - act.ly) / S.cam.s; act.lx = px; act.ly = py; need(true); break;
    case 'cut': cutMove(px, py, wx, wy); break;
    case 'paint': paintMove(wx, wy); break;
    case 'weld': weldMove(wx, wy); need(); break;
    case 'vdrag': {
      // accroche à un autre sommet (hors ceux qu'on déplace) : lâcher dessus = fusion
      const sn = snapExcluding(wx, wy, act.refs);
      act.snap = sn;
      const tx_ = sn ? sn[0] : wx, ty_ = sn ? sn[1] : wy;
      for (const f of act.refs) { f.r[f.i] = tx_; f.r[f.i + 1] = ty_; }
      act.moved = true;
      for (const id of act.provIds) { const p = S.provs.get(id); if (p) { p._path = null; p._bb = null; } }
      need(); break;
    }
  }
});

function endPointer(e) {
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const [wx, wy] = s2w(px, py);
  ptrs.delete(e.pointerId);
  if (gesture) { if ([...ptrs.values()].filter(p => p.type === 'touch').length < 2) { gesture = null; need(); } return; }
  if (!act) return;
  const a = act; act = null;
  cv.style.cursor = cursorFor();
  if (a.kind === 'pan') need();
  else if (a.kind === 'bgmove' || a.kind === 'bgresize') markDirty();
  else if (a.kind === 'cut') { act = a; cutUp(px, py, wx, wy); act = null; }
  else if (a.kind === 'paint') { if (a.changed) a.tx.commit(); }
  else if (a.kind === 'weld') { if (a.tx.commit()) toast(a.n + ' sommets fusionnés'); else toast('Rien à fusionner sous le pinceau'); G.geomDirty = G.asgnDirty = true; need(); }
  else if (a.kind === 'vdrag') {
    G.dragB = null; G.geomDirty = G.asgnDirty = true;
    if (a.snap) { dedupeRings(a.provIds); toast('Sommets fusionnés'); }
    if (a.moved) a.tx.commit();
    for (const id of a.provIds) { const p = S.provs.get(id); if (p) { p._path = null; p._bb = null; } }
    need();
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); abortAct(); });
cv.addEventListener('contextmenu', e => e.preventDefault());

function abortAct() {
  if (!act) { gesture = null; return; }
  const a = act; act = null;
  if (a.kind === 'cut') cutReset();
  else if (a.kind === 'paint' && a.changed) a.tx.commit();
  else if (a.kind === 'weld') applyEnts([...a.tx.before].map(([id, b]) => ({ id, before: b, after: null })), false);
  else if (a.kind === 'vdrag') { applyEnts([...a.tx.before].map(([id, b]) => ({ id, before: b, after: null })), false); G.dragB = null; }
  need();
}

const clampS = s => Math.max(0.4, Math.min(60000, s));
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const g = s2w(px, py);
  S.cam.s = clampS(S.cam.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)));
  S.cam.x = g[0] - (px - W / 2) / S.cam.s;
  S.cam.y = g[1] + (py - H / 2) / S.cam.s;
  wheelUntil = performance.now() + 220;
  need(true);
}, { passive: false });

function cursorFor() { return spaceDown || S.tool === 'hand' ? 'grab' : S.tool === 'select' ? 'default' : 'crosshair'; }

/* ===================================================================== clavier */
window.addEventListener('keydown', e => {
  if ($('#editor').hidden) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select') { if (e.key === 'Escape' || e.key === 'Enter') e.target.blur(); return; }
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); saveNow(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === ' ') { spaceDown = true; cv.style.cursor = 'grab'; e.preventDefault(); return; }
  if (k === 'escape') { cutReset(); if (act) abortAct(); return; }
  if (k === 'enter') { if (S.tool === 'poly') polyFinish(); else cutFinish(); return; }
  if (k === 'f') { fitView(); return; }
  if (k === 'l') { S.labels = !S.labels; need(); return; }
  if (k === '/') { e.preventDefault(); $('#search').focus(); return; }
  if (k === 'delete' || k === 'backspace') { if (S.view === 'prov') deleteSel(); return; }
  if (['1', '2', '3', '4', '5'].includes(k)) { setView(['prov', 'country', 'region', 'terrain', 'bg'][+k - 1]); return; }
  const map = S.view === 'prov'
    ? { v: 'select', c: 'cut', m: 'merge', d: 'vertex', w: 'weld', p: 'poly', f: 'fill', h: 'hand' }
    : S.view === 'bg' ? { b: 'bgmove', h: 'hand' }
    : S.view === 'terrain' ? { t: 'paint', i: 'pipette', h: 'hand', a: 'paint' }
    : { a: 'assign', i: 'pipette', h: 'hand' };
  if (map[k]) { setTool(map[k]); return; }
  if (S.view === 'prov' && S.tool === 'weld' && (k === '[' || k === ']')) { brush.r = Math.max(4, Math.min(120, Math.round(brush.r * (k === ']' ? 1.25 : 0.8)))); syncUI(); need(); return; }
  if (S.view === 'terrain' && (k === '[' || k === ']')) { S.pen = (S.pen + (k === ']' ? 1 : TERRAINS.length - 1)) % TERRAINS.length; syncUI(); }
});
window.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; cv.style.cursor = cursorFor(); } });
window.addEventListener('resize', resize);

/* ===================================================================== interface */
const VIEWS = [['prov', 'Provinces'], ['country', 'Pays'], ['region', 'Régions'], ['terrain', 'Terrain'], ['bg', 'Fonds']];
const TOOLS = {
  prov: [['select', '↖', 'Sélection', 'V'], ['cut', '✂', 'Découpe', 'C'], ['merge', '⊕', 'Fusion', 'M'], ['vertex', '◇', 'Sommets', 'D'], ['weld', '◎', 'Pinceau', 'W'], ['poly', '⬠', 'Polygone', 'P'], ['hand', '✋', 'Main', 'H']],
  bg: [['bgmove', '⇲', 'Placer', 'B'], ['hand', '✋', 'Main', 'H']],
  country: [['assign', '🖌', 'Assigner', 'A'], ['pipette', '💧', 'Pipette', 'I'], ['hand', '✋', 'Main', 'H']],
  region: [['assign', '🖌', 'Assigner', 'A'], ['pipette', '💧', 'Pipette', 'I'], ['hand', '✋', 'Main', 'H']],
  terrain: [['paint', '🖌', 'Stylo', 'T'], ['pipette', '💧', 'Pipette', 'I'], ['hand', '✋', 'Main', 'H']],
};
const HINTS = {
  'prov:select': 'Clique une province pour la sélectionner et l’éditer.',
  'prov:cut': 'Trace au stylet/souris à travers les terres, ou clique des points puis double-clic / Entrée. Dépasse de chaque côté. Clic droit = retire le dernier point, Échap annule.',
  'prov:merge': 'Sélectionne une province, puis clique les voisines : elles sont absorbées par la première (la frontière commune disparaît).',
  'prov:fill': 'Clique dans une zone vide entre des provinces : une province prend exactement la forme du vide (type : voir le panneau). Reclique sur Remplir (ou V) pour quitter.',
  'prov:poly': 'Clique des points (ils s’accrochent aux sommets existants) ; ferme en recliquant le 1er point, double-clic ou Entrée. Dans une terre = trou (lac), dans le vide = nouvelle zone. Type : voir le panneau.',
  'prov:weld': 'Pinceau de fusion : clique ou glisse, tous les sommets sous le cercle fusionnent en un seul (voisines incluses). [ ] ou le curseur du panneau = taille. Annuler = Ctrl+Z.',
  'bg:bgmove': 'Choisis un fond dans le panneau, glisse-le pour le déplacer ; poignées dans les coins = redimensionner (ratio conservé).',
  'prov:vertex': 'Glisse un sommet (les voisines suivent) ; lâche-le sur un autre sommet (cercle rouge) pour les fusionner. Clique une arête de la province sélectionnée pour ajouter un sommet. Clic droit sur un sommet = supprime.',
  'country:assign': 'Glisse sur les provinces pour les donner au pays actif. Clic droit = retirer.',
  'region:assign': 'Glisse sur les provinces pour les donner à la région active. Clic droit = retirer.',
  'terrain:paint': 'Glisse sur les provinces pour leur appliquer le terrain choisi. Clic droit = non défini. [ ] change de terrain.',
};

function setView(v) {
  S.view = v; cutReset();
  S.tool = TOOLS[v][0][0];
  syncUI(); need();
}
function setTool(t) { if (!(S.view === 'prov' && t === 'fill') && !TOOLS[S.view].some(x => x[0] === t)) return; S.tool = t; cutReset(); syncUI(); need(); cv.style.cursor = cursorFor(); }

function syncUI() {
  // vues
  $('#views').innerHTML = VIEWS.map(([k, n], i) => `<button data-v="${k}" class="${S.view === k ? 'on' : ''}" title="${i + 1}">${n}</button>`).join('');
  for (const b of $('#views').children) b.onclick = () => setView(b.dataset.v);
  // outils
  $('#tools').innerHTML = TOOLS[S.view].map(([k, ic, n, key]) => `<button data-t="${k}" class="${S.tool === k ? 'on' : ''}" title="${n} (${key})"><i>${ic}</i><small>${n}</small></button>`).join('')
