/* ===================================================================== export */
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function exportAll() {
  const r6 = v => Math.round(v * 1e6) / 1e6;
  const ringOut = (r, ccw) => {
    const pts = [];
    for (let i = 0; i < r.length; i += 2) pts.push([r6(r[i]), r6(r[i + 1])]);
    if ((C.ringArea(r) > 0) !== ccw) pts.reverse();
    pts.push(pts[0].slice());
    return pts;
  };
  const polysOut = p => p.polys.map(poly => poly.map((r, i) => ringOut(r, i === 0)));
  const provs = [...S.provs.values()].sort((a, b) => a.id - b.id);
  const typeOf = p => p.terrain === NOT_SET ? 'land' : TERRAINS[p.terrain][2];
  const provJson = {
    format: 1, projection: 'equirectangular', unit: 'degrees', coordinates: '[lon, lat]',
    terrains: TERRAINS.map((t, i) => ({ id: i, name: t[0], type: t[2], color: t[1] })),
    provinces: provs.map(p => {
      const bb = bbOf(p);
      return { id: p.id, name: p.name, color: p.color, country: p.country, region: p.region,
        terrain: p.terrain === NOT_SET ? null : p.terrain, type: typeOf(p), bbox: bb.map(r6), polygons: polysOut(p) };
    }),
  };
  const geo = {
    type: 'FeatureCollection',
    features: provs.map(p => ({ type: 'Feature',
      properties: { id: p.id, name: p.name, country: p.country, region: p.region, terrain: p.terrain === NOT_SET ? null : TERRAINS[p.terrain][0], type: typeOf(p) },
      geometry: { type: 'MultiPolygon', coordinates: polysOut(p) } })),
  };
  // régions : pays déduit (majoritaire)
  const rmap = new Map();
  for (const p of provs) if (p.region) { if (!rmap.has(p.region)) rmap.set(p.region, []); rmap.get(p.region).push(p); }
  const regions = [...rmap].map(([rid, ps]) => {
    const r = S.regions.get(rid) || { name: 'Région ' + rid, color: '#888', pop: 0, notes: '' };
    const cnt = new Map(); for (const p of ps) cnt.set(p.country, (cnt.get(p.country) || 0) + 1);
    const country = [...cnt].sort((a, b) => b[1] - a[1])[0][0];
    return { id: rid, name: r.name, country, color: r.color, population: r.pop || 0, notes: r.notes || '', provinces: ps.map(p => p.id) };
  });
  const countries = [...S.countries.values()].map(c => ({
    id: c.id, name: c.name, tag: c.tag || '', color: c.color,
    regions: regions.filter(r => r.country === c.id).map(r => r.id),
    provinces: provs.filter(p => p.country === c.id).map(p => p.id),
  })).filter(c => c.provinces.length);
  const enc = new TextEncoder(), j = o => enc.encode(JSON.stringify(o));
  const date = new Date().toISOString().slice(0, 10), dir = 'bopvec_export_' + date + '/';
  const zip = C.makeZip([
    { name: dir + 'provinces.json', data: j(provJson) },
    { name: dir + 'provinces.geojson', data: j(geo) },
    { name: dir + 'regions.json', data: j({ regions }) },
    { name: dir + 'countries.json', data: j({ countries }) },
  ]);
  download('bopvec_export_' + date + '.zip', new Blob([zip], { type: 'application/zip' }));
  const issues = bilan().filter(c => c.warn && c.items.length).map(c => c.items.length + ' ' + c.t.toLowerCase());
  toast('Export : ' + provs.length + ' provinces, ' + regions.length + ' régions, ' + countries.length + ' pays'
    + (issues.length ? ' — attention : ' + issues.join(', ') + ' (menu → Bilan)' : ''));
}

/* ===================================================================== cloud GitHub
   Sauvegarde des projets dans un dépôt GitHub (privé de préférence) : saves/<nom>.bopvec.gz.
   Réglages (dépôt, branche, jeton) gardés dans localStorage de CET appareil ; le jeton ne part
   que vers api.github.com. Le projet est identifié par son nom cloud + le sha de la dernière
   version synchronisée : un conflit (autre appareil entre-temps) n'écrase jamais en silence. */
const CLOUD = {
  load() { try { return JSON.parse(localStorage.getItem('bopvec.cloud') || 'null'); } catch (_) { return null; } },
  store(c) { try { localStorage.setItem('bopvec.cloud', JSON.stringify(c)); return true; } catch (_) { return false; } },
  busy: false, timer: 0,
};
const slugify = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'projet';
const cloudReady = () => { const c = CLOUD.load(); return !!(c && c.repo && c.token); };

async function gzipStr(str) {
  const cs = new CompressionStream('gzip'), w = cs.writable.getWriter();
  w.write(new TextEncoder().encode(str)); w.close();
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}
async function gunzipBuf(buf) {
  const ds = new DecompressionStream('gzip'), w = ds.writable.getWriter();
  w.write(buf); w.close();
  return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
}
function toB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

function ghFetch(path, opt = {}) {
  const c = CLOUD.load();
  const base = (c.api || 'https://api.github.com').replace(/\/$/, '');
  const headers = {
    Authorization: 'Bearer ' + c.token,
    Accept: opt.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
  };   // pas d'en-tête X-GitHub-Api-Version : un en-tête de moins à faire accepter par le CORS
  if (opt.body) headers['Content-Type'] = 'application/json';
  return fetch(base + '/repos/' + c.repo + path, { method: opt.method || 'GET', headers, body: opt.body });
}
const refQ = () => '?ref=' + encodeURIComponent((CLOUD.load().branch || 'main'));

async function cloudTest() {
  const r = await ghFetch('');
  if (r.status === 401) throw new Error('jeton refusé (401)');
  if (r.status === 404) throw new Error('dépôt introuvable ou jeton sans accès (404)');
  if (!r.ok) throw new Error('GitHub ' + r.status);
  const j = await r.json();
  if (j.permissions && !j.permissions.push) throw new Error('le jeton n’a pas le droit d’écrire (Contents : Read and write)');
  return j;
}

async function cloudList() {
  const r = await ghFetch('/contents/saves' + refQ());
  if (r.status === 404) return [];
  if (!r.ok) throw new Error('GitHub ' + r.status);
  const arr = await r.json();
  return arr.filter(f => f.type === 'file' && f.name.endsWith('.bopvec.gz'));
}

async function cloudPush(manual) {
  if (CLOUD.busy || !cloudReady() || !S.id) return false;
  CLOUD.busy = true;
  try {
    const c = CLOUD.load();
    if (!S.cloudName) S.cloudName = slugify(S.name);
    const path = '/contents/saves/' + encodeURIComponent(S.cloudName) + '.bopvec.gz';
    setSaved('☁ envoi…');
    const content = toB64(await gzipStr(JSON.stringify(serialize())));
    const put = sha => ghFetch(path, {
      method: 'PUT',
      body: JSON.stringify({ message: 'Sauvegarde « ' + S.name + ' » (' + S.provs.size + ' provinces)', content, branch: c.branch || 'main', ...(sha ? { sha } : {}) }),
    });
    let r = await put(S.cloudSha || undefined);
    if (r.status === 409 || r.status === 422 || r.status === 404) {
      const cur = await ghFetch(path + refQ());
      if (cur.ok) {
        const meta = await cur.json();
        if (!manual) {
          S.cloudConflict = true; setSaved('⚠ conflit cloud');
          toast('Le cloud contient une autre version de ce projet : ouvre ☰ → Cloud pour choisir.');
          return false;
        }
        if (!confirm('Le cloud contient une version différente de « ' + S.cloudName + ' » (autre appareil, ou autre projet du même nom).\nÉcraser le cloud avec cette version ?')) { setSaved('☁ envoi annulé'); return false; }
        r = await put(meta.sha);
      } else if (cur.status === 404) r = await put(undefined);
    }
    if (!r.ok) throw new Error(r.status === 401 ? 'jeton refusé' : r.status === 403 ? 'accès refusé (droits du jeton ?)' : 'GitHub ' + r.status);
    const j = await r.json();
    S.cloudSha = j.content.sha; S.cloudConflict = false;
    await saveNow(true);
    setSaved('☁ synchronisé ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }));
    return true;
  } catch (e) {
    setSaved('⚠ cloud : ' + e.message);
    if (manual) toast('Envoi cloud impossible : ' + e.message);
    return false;
  } finally { CLOUD.busy = false; }
}

function cloudSchedule() {
  const c = CLOUD.load();
  if (!c || !c.auto || !cloudReady() || S.cloudConflict || $('#editor').hidden) return;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(() => cloudPush(false), c.delay || 15000);
}

async function cloudCheck() {
  if (!S.cloudName || !cloudReady()) return;
  try {
    const r = await ghFetch('/contents/saves/' + encodeURIComponent(S.cloudName) + '.bopvec.gz' + refQ());
    if (!r.ok) return;
    const j = await r.json();
    if (j.sha !== S.cloudSha) { S.cloudConflict = true; setSaved('☁ version plus récente dans le cloud'); toast('Une autre version de ce projet existe dans le cloud (☰ → Cloud pour la récupérer).'); }
    else setSaved('☁ à jour');
  } catch (_) { /* hors ligne */ }
}

async function cloudOpen(item) {
  try {
    const existing = DB.db ? await DB.get('c_' + item.name.replace(/\.bopvec\.gz$/, '')).catch(() => null) : null;
    if (existing && !confirm('Une copie locale de ce projet existe sur cet appareil. La remplacer par la version du cloud ?')) return;
    busy(true, 'Téléchargement depuis GitHub…'); await tick();
    const r = await ghFetch('/contents/' + item.path.split('/').map(encodeURIComponent).join('/') + refQ(), { raw: true });
    if (!r.ok) throw new Error('GitHub ' + r.status);
    const d = JSON.parse(await gunzipBuf(new Uint8Array(await r.arrayBuffer())));
    deserialize(d);
    S.cloudName = item.name.replace(/\.bopvec\.gz$/, ''); S.cloudSha = item.sha; S.cloudConflict = false;
    S.id = 'c_' + S.cloudName;
    busy(false); $('#dlg').hidden = true;
    openEditor(true);
    await saveNow(true);
    setSaved('☁ à jour');
  } catch (e) { busy(false); toast('Ouverture cloud impossible : ' + e.message); }
}

async function showCloud() {
  const inEditor = !$('#editor').hidden && S.id;
  const c = CLOUD.load() || { repo: '', branch: 'main', token: '', auto: true };
  $('#dlgTitle').textContent = 'Cloud GitHub';
  const body = $('#dlgBody');
  body.innerHTML = `
    <div class="kv">Tes projets sont sauvegardés dans un dépôt GitHub <b>privé</b> (fichiers <code>saves/*.bopvec.gz</code>) : tu reprends le même projet depuis n’importe quel appareil.</div>
    <div class="row"><label>Dépôt</label><input type="text" id="clRepo" placeholder="farrey360/bop-saves" value="${esc(c.repo || '')}"></div>
    <div class="row"><label>Branche</label><input type="text" id="clBranch" value="${esc(c.branch || 'main')}"></div>
    <div class="row"><label>Jeton</label><input type="password" id="clToken" placeholder="github_pat_…" value="${esc(c.token || '')}" autocomplete="off"></div>
    <div class="row"><label style="width:auto"><input type="checkbox" id="clAuto" ${c.auto !== false ? 'checked' : ''}> envoi automatique après chaque sauvegarde (~15 s)</label></div>
    <div class="row"><button id="clSave">Enregistrer et tester la connexion</button></div>
    <div id="clMsg" class="kv"></div>
    <details ${c.token ? '' : 'open'}><summary>Comment créer le dépôt et le jeton (une fois)</summary>
      <div class="kv" style="line-height:1.5">1. GitHub → <b>New repository</b> → nom <code>bop-saves</code> → <b>Private</b>.<br>
      2. GitHub → Settings → Developer settings → <b>Fine-grained tokens</b> → Generate : accès <i>Only select repositories</i> = bop-saves ; permission <b>Contents : Read and write</b>.<br>
      3. Colle ici <i>Dépôt</i> (<code>ton-compte/bop-saves</code>) et le <i>Jeton</i>. Sur chaque nouvel appareil, refais seulement l’étape 3.<br>
      Le jeton reste dans ce navigateur et ne sert qu’à parler à api.github.com.</div></details>
    <hr style="border:0;border-top:1px solid var(--line);margin:10px 0">
    ${inEditor ? `<div class="row"><button id="clPush">Envoyer « ${esc(S.name)} » maintenant</button></div>
      <div class="kv" id="clState">Nom cloud : <b>${esc(S.cloudName || slugify(S.name))}</b>${S.cloudSha ? ' · lié au cloud' : ' · pas encore envoyé'}</div>` : ''}
    <div class="row"><b>Projets dans le cloud</b><button id="clRefresh" style="flex:none">↻</button></div>
    <div id="clList" class="chips" style="padding-left:0"><span class="kv">…</span></div>`;
  const read = () => ({
    repo: $('#clRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, ''),
    branch: $('#clBranch').value.trim() || 'main', token: $('#clToken').value.trim(), auto: $('#clAuto').checked,
    api: (CLOUD.load() || {}).api, delay: (CLOUD.load() || {}).delay,
  });
  const msg = (t, bad) => { const m = $('#clMsg'); m.textContent = t; m.style.color = bad ? 'var(--danger)' : 'var(--ok)'; };
  const refresh = async () => {
    const box = $('#clList');
    if (!cloudReady()) { box.innerHTML = '<span class="kv">Renseigne le dépôt et le jeton.</span>'; return; }
    box.innerHTML = '<span class="kv">…</span>';
    try {
      const list = await cloudList();
      box.innerHTML = list.length ? list.map((f, i) => `<button data-i="${i}">${esc(f.name.replace(/\.bopvec\.gz$/, ''))} · ${(f.size / 1e6).toFixed(1)} Mo</button>`).join('') : '<span class="kv">Aucune sauvegarde pour l’instant.</span>';
      for (const b of box.querySelectorAll('button[data-i]')) b.onclick = () => cloudOpen(list[+b.dataset.i]);
    } catch (e) { box.innerHTML = `<span class="kv" style="color:var(--danger)">${esc(e.message)}</span>`; }
  };
  $('#clSave').onclick = async () => {
    const n = read();
    if (!/^[\w.-]+\/[\w.-]+$/.test(n.repo)) return msg('Dépôt invalide : écris « compte/nom ».', true);
    if (!n.token) return msg('Colle ton jeton.', true);
    if (!CLOUD.store(n)) return msg('Impossible d’enregistrer les réglages (stockage du navigateur bloqué).', true);
    msg('Test…');
    try { const j = await cloudTest(); msg('Connexion OK : ' + j.full_name + (j.private ? ' (privé)' : ' — ATTENTION : dépôt PUBLIC, tes sauvegardes seraient visibles de tous'), j.private === false); S.cloudConflict = false; refresh(); }
    catch (e) { msg(e.message, true); }
  };
  if ($('#clPush')) $('#clPush').onclick = async () => { CLOUD.store(read()); msg('Envoi…'); const ok = await cloudPush(true); msg(ok ? 'Envoyé.' : 'Échec (voir le message en haut).', !ok);
    const st = $('#clState'); if (st && S.cloudSha) st.innerHTML = 'Nom cloud : <b>' + esc(S.cloudName) + '</b> · lié au cloud';
    setTimeout(refresh, 1500); };
  $('#clRefresh').onclick = refresh;
  $('#dlg').hidden = false;
  refresh();
}

/* ===================================================================== accueil / fichiers */
let toastT = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}
const busy = (on, msg) => { $('#busy').textContent = msg || 'Chargement…'; $('#busy').hidden = !on; };
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error(src + ' introuvable'));
    document.head.appendChild(s);
  });
}
const tick = () => new Promise(r => setTimeout(r, 30));

async function showHome() {
  $('#editor').hidden = true; $('#home').hidden = false;
  let list = [];
  try { list = (await DB.list()).sort((a, b) => b.updated - a.updated); } catch (e) { /* stockage indisponible */ }
  $('#projects').innerHTML = `
    <div class="card new" id="cNewNE"><div class="plus">＋</div><b>Nouveau projet</b><span>Monde Natural Earth 50 m (terres, pays déjà séparés)</span></div>
    <div class="card new" id="cCloud"><div class="plus">☁</div><b>Ouvrir depuis le cloud</b><span>Reprendre un projet sauvegardé sur GitHub</span></div>
    <div class="card new" id="cNewNE10"><div class="plus">＋</div><b>Nouveau — détaillé (10 m)</b><span>Côtes et petites îles précises, plus lourd à charger</span></div>
    <div class="card new" id="cImport"><div class="plus">⇪</div><b>Importer</b><span>.bopvec ou GeoJSON de ta carte</span></div>`
    + list.map(m => `<div class="card" data-id="${m.id}">${m.thumb ? `<img src="${m.thumb}" alt="">` : '<img alt="">'}<button class="x" title="Supprimer">×</button>
      <div class="meta"><b>${esc(m.name)}</b><span>${m.nProv} provinces · ${new Date(m.updated).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</span></div></div>`).join('');
  $('#cNewNE').onclick = async () => { busy(true); await tick(); loadNaturalEarth(); S.name = 'Monde ' + new Date().toLocaleDateString('fr-FR'); S.id = 'p' + Date.now().toString(36); busy(false); openEditor(true); markDirty(); };
  $('#cCloud').onclick = showCloud;
  $('#cNewNE10').onclick = async () => {
    busy(true, 'Chargement de la carte 10 m… (quelques secondes)'); await tick();
    try {
      if (!window.NE10_COUNTRIES) await loadScript('ne10.js');
      loadNaturalEarth(window.NE10_COUNTRIES);
      S.name = 'Monde 10 m ' + new Date().toLocaleDateString('fr-FR'); S.id = 'p' + Date.now().toString(36);
      busy(false); openEditor(true); markDirty();
    } catch (err) { busy(false); toast('Carte 10 m indisponible : ' + err.message + ' (lance tools/build-ne.js, voir README)'); }
  };
  $('#cImport').onclick = () => { $('#file').value = ''; $('#file').click(); };
  for (const c of $('#projects').querySelectorAll('.card[data-id]')) {
    c.onclick = async ev => {
      const id = c.dataset.id;
      if (ev.target.classList.contains('x')) {
        if (!confirm('Supprimer ce projet ?')) return;
        await DB.del(id); showHome(); return;
      }
      busy(true); await tick();
      const rec = await DB.get(id); deserialize(rec.data); S.id = id; busy(false); openEditor(true);
    };
  }
}

$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  busy(true); await tick();
  try {
    const d = JSON.parse(await f.text());
    if (d.provinces && d.format) { deserialize(d); S.name = d.name || f.name.replace(/\.\w+$/, ''); }
    else if (d.features) { loadGeoJSON(d); S.name = f.name.replace(/\.\w+$/, ''); }
    else throw new Error('Format inconnu');
    S.id = 'p' + Date.now().toString(36);
    busy(false); openEditor(true); markDirty();
  } catch (err) { busy(false); toast('Import impossible : ' + err.message); }
};

function openEditor(fit) {
  $('#home').hidden = true; $('#editor').hidden = false;
  S.view = 'prov'; S.tool = 'select'; S.sel = 0; S.dirty = false; setSaved('');
  $('#pname').value = S.name;
  G.geomDirty = G.asgnDirty = true;
  resize();
  if (fit) fitView();
  syncUI(); need();
  cloudCheck();
}

/* ===================================================================== démarrage */
(async function init() {
  try {
    await Promise.race([DB.open(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 2500))]);
  } catch (e) { DB.db = null; console.warn('IndexedDB indisponible', e); }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeunload', ev => { if (S.dirty && DB.db) { saveNow(); } });
  showHome();
})();
</script>
</body>
