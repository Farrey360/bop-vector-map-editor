        if (!lg) continue;
        try { g = pc.intersection(c.g, lg); } catch (err) { continue; }
      } else if (blockG.length) { try { g = pc.difference(g, ...blockG); } catch (err) { continue; } }
      const polys = pcBack(g);
      if (!polys.length) continue;
      made.push({ polys, country, region, g: polys.map(pcPoly) });
    }
    if (!made.length) { toast('Rien à créer : les zones sortent de la terre existante'); return; }
    const tx = new Tx();
    const cover = pc.union(...made.flatMap(m => m.g));
    const ents = [];                    // entités touchées : {p (ancienne) | m (nouvelle), polys}
    for (const p of lands) {            // les nouvelles provinces remplacent ce qu'elles recouvrent
      if (!p.polys.length) continue;
      let left;
      try { left = pcBack(pc.difference(p.polys.map(pcPoly), cover)); } catch (err) { continue; }
      if (left.length === p.polys.length && C.polysArea(left) >= C.polysArea(p.polys) - 1e-12) continue;
      ents.push({ p, polys: left });
    }
    for (const m of made) ents.push({ m, polys: m.polys });
    // anti-éclats : les petits bouts fins (bords mal alignés) sont fusionnés dans la voisine au plus long bord commun
    const thr = (VX.opts.sliver || 0) * Math.max(kx, ky) * (k.u || 1);
    if (thr > 0) {
      const perim = polys => { let t = 0; for (const pl of polys) for (const r of pl) { for (let i = 0; i < r.length; i += 2) { const j = (i + 2) % r.length; t += Math.hypot(r[j] - r[i], r[j + 1] - r[i + 1]); } } return t; };
      const thin = pl => { const a = C.polysArea([pl]), q = perim([pl]); return a < 2 * thr * thr || (q > 0 && 2 * a / q < thr); };
      const bbP = polys => { const b = [Infinity, Infinity, -Infinity, -Infinity]; for (const pl of polys) C.ringBBox(pl[0], b); return b; };
      const cOf = e => (e.p || e.m).country;
      const slivers = [];
      for (const e of ents) {
        if (!e.polys.length) continue;
        let big = 0;
        if (e.m) for (let i = 1; i < e.polys.length; i++) if (C.polysArea([e.polys[i]]) > C.polysArea([e.polys[big]])) big = i;
        const keepP = [];
        e.polys.forEach((pl, i) => { if ((e.m && i === big) || !thin(pl)) keepP.push(pl); else slivers.push({ e, pl }); });
        e.polys = keepP;
      }
      for (const s of slivers) {
        const sb = bbP([s.pl]); sb[0] -= thr; sb[1] -= thr; sb[2] += thr; sb[3] += thr;
        const sp = perim([s.pl]);
        let best = null, bs = 1e-9;
        for (const e of ents) {
          if (e === s.e || !e.polys.length || cOf(e) !== cOf(s.e) || disjoint(bbP(e.polys), sb)) continue;   // jamais à travers une frontière de pays
          let u; try { u = pcBack(pc.union(e.polys.map(pcPoly), [pcPoly(s.pl)])); } catch (err) { continue; }
          if (u.length >= e.polys.length + 1) continue;      // pas de contact
          const sh = (sp + perim(e.polys) - perim(u)) / 2;
          if (sh > bs) { bs = sh; best = { e, u }; }
        }
        if (best) best.e.polys = best.u;
        else s.e.polys.push(s.pl);        // sans voisine : on garde (jamais de terre perdue)
      }
    }
    for (const e of ents) {
      if (e.m) { e.m.polys = e.polys; continue; }
      tx.touch(e.p);
      if (!e.polys.length) S.provs.delete(e.p.id); else { e.p.polys = e.polys; inval(e.p); }
    }
    for (const m of made) {
      if (!m.polys.length) continue;
      const np = addProvince(nextLandName(), m.polys, m.country);
      np.region = m.region; tx.born(np);
    }
    tx.commit(); G.geomDirty = G.asgnDirty = true;
    const n = made.length;
    vecReset();
    toast(n + ' province' + (n > 1 ? 's' : '') + ' créée' + (n > 1 ? 's' : '') + ' (Ctrl+Z pour annuler)');
  } catch (err) { toast('Échec : ' + err.message); console.error(err); }
  finally { busy(false); }
}

/* ===================================================================== recherche / bilan / renommage */
function zoomTo(bb) {
  const w = Math.max(bb[2] - bb[0], 0.02), h = Math.max(bb[3] - bb[1], 0.02);
  S.cam.x = (bb[0] + bb[2]) / 2; S.cam.y = (bb[1] + bb[3]) / 2;
  S.cam.s = clampS(Math.min(4000, W * 0.6 / w, H * 0.6 / h));
  need();
}
function gotoProv(id) {
  const p = S.provs.get(id);
  if (!p) return;
  if (S.view !== 'prov') setView('prov');
  S.sel = id; zoomTo(bbOf(p)); syncUI();
}
function gotoCountry(id) {
  const bb = [Infinity, Infinity, -Infinity, -Infinity];
  for (const p of S.provs.values()) if (p.country === id) { const b = bbOf(p); bb[0] = Math.min(bb[0], b[0]); bb[1] = Math.min(bb[1], b[1]); bb[2] = Math.max(bb[2], b[2]); bb[3] = Math.max(bb[3], b[3]); }
  setView('country'); S.actC = id;
  if (isFinite(bb[0])) zoomTo(bb);
  syncUI();
}

function searchResults(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const out = [];
  for (const c of S.countries.values()) if (c.name.toLowerCase().includes(q) || (c.tag || '').toLowerCase() === q) out.push({ k: 'c', id: c.id, t: c.name, s: 'pays' });
  for (const p of S.provs.values()) if (p.name.toLowerCase().includes(q)) out.push({ k: 'p', id: p.id, t: p.name, s: 'province #' + p.id });
  return out.slice(0, 12);
}
function pickResult(r) {
  $('#sres').hidden = true; $('#search').value = ''; $('#search').blur();
  if (r.k === 'p') gotoProv(r.id); else gotoCountry(r.id);
}

function terrType(p) { return p.terrain === NOT_SET ? 'land' : TERRAINS[p.terrain][2]; }

/* signature de la géométrie : une province validée « en plusieurs parties » réapparaît si ses contours changent */
function multiSig(p) {
  let h = 2166136261 >>> 0;
  for (const poly of p.polys) for (const r of poly) { h = Math.imul(h ^ r.length, 16777619) >>> 0; for (const v of r) h = Math.imul(h ^ (Math.round(v * 1e6) | 0), 16777619) >>> 0; }
  return p.polys.length + ':' + h.toString(36);
}
function vValidate() {
  const p = V.curK === 'p' ? S.provs.get(V.curId) : null;
  if (!p || !bilan()[V.cat].valid) return;
  const tx = new Tx(); tx.touch(p); p.okMulti = multiSig(p); tx.commit(); need();
  vStep(1);
}

function bilan() {
  const lands = [...S.provs.values()].filter(p => terrType(p) === 'land');
  const all = [...S.provs.values()];
  const names = new Map();
  for (const p of all) names.set(p.name, (names.get(p.name) || 0) + 1);
  const usedC = new Set(all.map(p => p.country)), usedR = new Set(all.map(p => p.region));
  const hasRegions = S.regions.size > 0;
  const item = p => ({ k: 'p', id: p.id, t: p.name });
  return [
    { t: 'Terres sans pays', warn: true, items: lands.filter(p => !p.country).map(item) },
    { t: 'Terres sans région', warn: hasRegions, items: hasRegions ? lands.filter(p => !p.region).map(item) : [] },
    { t: 'Provinces sans terrain défini', warn: true, items: all.filter(p => p.terrain === NOT_SET).map(item) },
    { t: 'Mers/infranchissables rattachées à un pays', warn: true, items: all.filter(p => terrType(p) !== 'land' && p.country).map(item) },
    { t: 'Noms en double', warn: true, items: all.filter(p => names.get(p.name) > 1).map(item) },
    { t: 'Très petites provinces (< 0,002 °²)', warn: false, items: all.filter(p => C.polysArea(p.polys) < 0.002).map(item) },
    { t: 'Provinces en plusieurs parties', warn: false, valid: true, items: all.filter(p => p.polys.length > 1 && p.okMulti !== multiSig(p)).map(item) },
    { t: 'Pays vides', warn: false, items: [...S.countries.values()].filter(c => !usedC.has(c.id)).map(c => ({ k: 'cn', id: c.id, t: c.name })) },
    { t: 'Régions vides', warn: false, items: [...S.regions.values()].filter(r => !usedR.has(r.id)).map(r => ({ k: 'rg', id: r.id, t: r.name })) },
    { t: 'Mers sans région de mer', warn: all.some(p => p.region && terrType(p) === 'sea'), items: all.some(p => p.region && terrType(p) === 'sea') ? all.filter(p => !p.region && terrType(p) === 'sea').map(item) : [] },
    { t: 'Régions mélangeant terre et mer', warn: true, items: mixedRegions(all) },
    ...airBilan(all),
  ];
}

function gotoItem(it) {
  if (it.k === 'p') gotoProv(it.id);
  else if (it.k === 'cn') { setView('country'); S.actC = it.id; syncUI(); }
  else if (it.k === 'az') { setView((S.zones.get(it.id) || {}).sea ? 'naval' : 'air'); S.actZ = it.id; syncUI(); airGo(it.id); }
  else if (it.k === 'rz') { setView('air'); airGo(0, it.id); }
  else { setView('region'); S.actR = it.id; syncUI(); }
}

/* mode « vérification » : barre précédent/suivant qui enchaîne les éléments d'une catégorie du bilan.
   La liste est recalculée à chaque pas : un élément corrigé disparaît tout seul. */
const V = { cat: -1, pos: 0, curId: null, curK: null };
function vItems() { const c = bilan()[V.cat]; return c ? c.items : []; }
function vShow() {
  const cat = bilan()[V.cat], items = cat ? cat.items : [];
  if (!items.length) { vStop(); toast('Terminé : plus rien dans « ' + (cat ? cat.t : '') + ' »'); return; }
  V.pos = Math.max(0, Math.min(V.pos, items.length - 1));
  const it = items[V.pos];
  V.curId = it.id; V.curK = it.k;
  gotoItem(it);
  $('#vbTxt').textContent = cat.t + ' — ' + (V.pos + 1) + ' / ' + items.length + ' : ' + it.t;
  $('#vbOk').hidden = !cat.valid;
  $('#vbar').hidden = false;
}
function vStart(cat, pos) { V.cat = cat; V.pos = pos || 0; $('#dlg').hidden = true; vShow(); }
function vStop() { V.cat = -1; $('#vbar').hidden = true; }
function vStep(dir) {
  if (V.cat < 0) return;
  const items = vItems();
  const still = items[V.pos] && items[V.pos].id === V.curId && items[V.pos].k === V.curK;
  // élément courant toujours présent : on avance d'un cran ; corrigé (disparu) : le suivant a pris sa place
  V.pos += dir > 0 ? (still ? 1 : 0) : -1;
  if (V.pos >= items.length) { vStop(); toast('Fin de la liste'); return; }
  if (V.pos < 0) V.pos = 0;
  vShow();
}

function showBilan() {
  $('#dlgTitle').textContent = 'Bilan et vérifications';
  const cats = bilan(), body = $('#dlgBody');
  const total = S.provs.size;
  body.innerHTML = `<div class="kv">${total} provinces · ${S.countries.size} pays · ${S.regions.size} régions</div>`
    + cats.map((c, i) => `<details ${c.items.length && c.warn ? 'open' : ''}><summary><span class="${c.items.length ? (c.warn ? 'bad' : 'mid') : 'good'}">${c.items.length ? c.items.length : '✓'}</span> ${esc(c.t)}${c.items.length ? ` <button class="vgo" data-go="${i}">Vérifier ▶</button>` : ''}</summary>
      <div class="chips">${c.items.slice(0, 80).map((it, j) => `<button data-c="${i}" data-j="${j}">${esc(it.t)}</button>`).join('')}${c.items.length > 80 ? `<span class="kv">… +${c.items.length - 80}</span>` : ''}</div></details>`).join('');
  for (const b of body.querySelectorAll('button[data-c]')) b.onclick = () => vStart(+b.dataset.c, +b.dataset.j);
  for (const b of body.querySelectorAll('button[data-go]')) b.onclick = e => { e.preventDefault(); e.stopPropagation(); vStart(+b.dataset.go, 0); };
  $('#dlg').hidden = false;
}

function renameBatch(kind, id) {
  const holder = kind === 'country' ? S.countries.get(id) : S.regions.get(id);
  if (!holder) return;
  const ps = [...S.provs.values()].filter(p => (kind === 'country' ? p.country : p.region) === id)
    .sort((a, b) => { const A = bbOf(a), B = bbOf(b); return (B[3] + B[1]) - (A[3] + A[1]) || (A[0] + A[2]) - (B[0] + B[2]); });
  if (!ps.length) { toast('Aucune province'); return; }
  const tx = new Tx();
  ps.forEach((p, i) => { tx.touch(p); p.name = ps.length === 1 ? holder.name : holder.name + ' ' + (i + 1); });
  tx.commit(); G.asgnDirty = true; need();
  toast(ps.length + (ps.length > 1 ? ' provinces renommées (du nord au sud)' : ' province renommée'));
}

/* ===================================================================== outils : sommets */
function forEachRing(cb) { for (const p of S.provs.values()) for (const poly of p.polys) for (const r of poly) cb(p, r); }

function collectRefs(x, y) {
  const refs = [], eps = 1e-9;
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (x < bb[0] - eps || x > bb[2] + eps || y < bb[1] - eps || y > bb[3] + eps) continue;
    for (const poly of p.polys) for (const r of poly) {
      for (let i = 0; i < r.length; i += 2) if (Math.abs(r[i] - x) < eps && Math.abs(r[i + 1] - y) < eps) refs.push({ p, r, i });
    }
  }
  return refs;
}

function startVertexDrag(refs) {
  const tx = new Tx(), ids = new Set();
  for (const f of refs) { tx.touch(f.p); ids.add(f.p.id); }
  const b = new Path2D();
  for (const e of G.edges) { if (ids.has(e.a) || ids.has(e.b)) continue; b.moveTo(e.x1, e.y1); b.lineTo(e.x2, e.y2); }
  G.dragB = b;
  act = { kind: 'vdrag', refs, tx, provIds: ids, moved: false };
  need();
}

function vertexDown(e, px, py, wx, wy, right) {
  const r = 10 / S.cam.s;
  let best = null, bd = r * r;
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (wx < bb[0] - r || wx > bb[2] + r || wy < bb[1] - r || wy > bb[3] + r) continue;
    for (const poly of p.polys) for (const ring of poly) for (let i = 0; i < ring.length; i += 2) {
      const dx = ring[i] - wx, dy = ring[i + 1] - wy, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = [ring[i], ring[i + 1]]; }
    }
  }
  if (best) {
    const refs = collectRefs(best[0], best[1]);
    if (right) deleteVertices(refs); else startVertexDrag(refs);
    return;
  }
  if (right) return;
  // arête de la province sélectionnée -> nouveau sommet
  const sp = S.provs.get(S.sel);
  if (sp) {
    let eb = null, ed = r;
    for (const poly of sp.polys) for (const ring of poly) {
      const n = ring.length / 2;
      for (let k = 0; k < n; k++) {
        const ax = ring[2 * k], ay = ring[2 * k + 1], j = (k + 1) % n, bx = ring[2 * j], by = ring[2 * j + 1];
        const ex = bx - ax, ey = by - ay, l2 = ex * ex + ey * ey;
        if (!l2) continue;
        const t = Math.max(0, Math.min(1, ((wx - ax) * ex + (wy - ay) * ey) / l2));
        const qx = ax + t * ex, qy = ay + t * ey, d = Math.hypot(wx - qx, wy - qy);
        if (d < ed && t > 0 && t < 1) { ed = d; eb = { ax, ay, bx, by, qx, qy }; }
      }
    }
    if (eb) { insertVertexShared(eb); return; }
  }
  const p = hitProv(wx, wy);
  S.sel = p ? p.id : 0; syncUI(); need();
}

// sommet le plus proche du curseur, en ignorant les sommets en cours de déplacement
function snapExcluding(wx, wy, refs) {
  const r = 10 / S.cam.s;
  const skip = new Map();
  for (const f of refs) { if (!skip.has(f.r)) skip.set(f.r, new Set()); skip.get(f.r).add(f.i); }
  let best = null, bd = r * r;
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (wx < bb[0] - r || wx > bb[2] + r || wy < bb[1] - r || wy > bb[3] + r) continue;
    for (const pl of p.polys) for (const ring of pl) {
      const sk = skip.get(ring);
      for (let i = 0; i < ring.length; i += 2) {
        if (sk && sk.has(i)) continue;
        const dx = ring[i] - wx, dy = ring[i + 1] - wy, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = [ring[i], ring[i + 1]]; }
      }
    }
  }
  return best;
}

// retire les doublons consécutifs (sommets fusionnés voisins dans un même contour)
function dedupeRings(ids) {
  for (const id of ids) {
    const p = S.provs.get(id); if (!p) continue;
    for (const poly of p.polys) for (const r of poly) {
      for (let i = r.length - 2; i >= 0 && r.length > 6; i -= 2) {
        const j = i === 0 ? r.length - 2 : i - 2;
        if (j !== i && Math.abs(r[i] - r[j]) < 1e-9 && Math.abs(r[i + 1] - r[j + 1]) < 1e-9) r.splice(i, 2);
      }
    }
    inval(p);
  }
}

function insertVertexShared(eb) {
  const tx = new Tx(), refs = [];
  const same = (x, y, u, v) => Math.abs(x - u) < 1e-9 && Math.abs(y - v) < 1e-9;
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (disjoint(bb, [Math.min(eb.ax, eb.bx) - 1e-9, Math.min(eb.ay, eb.by) - 1e-9, Math.max(eb.ax, eb.bx) + 1e-9, Math.max(eb.ay, eb.by) + 1e-9])) continue;
    for (const poly of p.polys) for (const r of poly) {
      const n = r.length / 2;
      for (let k = 0; k < n; k++) {
        const j = (k + 1) % n;
        const fw = same(r[2 * k], r[2 * k + 1], eb.ax, eb.ay) && same(r[2 * j], r[2 * j + 1], eb.bx, eb.by);
        const bw = same(r[2 * k], r[2 * k + 1], eb.bx, eb.by) && same(r[2 * j], r[2 * j + 1], eb.ax, eb.ay);
        if (!fw && !bw) continue;
        tx.touch(p); r.splice(2 * (k + 1), 0, eb.qx, eb.qy); inval(p);
        refs.push({ p, r, i: 2 * (k + 1) });
        break;
      }
    }
  }
  if (!refs.length) return;
  const ids = new Set(refs.map(f => f.p.id));
  const b = new Path2D();
  for (const e of G.edges) { if (ids.has(e.a) || ids.has(e.b)) continue; b.moveTo(e.x1, e.y1); b.lineTo(e.x2, e.y2); }
  G.dragB = b;
  act = { kind: 'vdrag', refs, tx, provIds: ids, moved: true };
  need();
}

function deleteVertices(refs) {
  const tx = new Tx();
  const byRing = new Map();
  for (const f of refs) { if (!byRing.has(f.r)) byRing.set(f.r, { p: f.p, idx: [] }); byRing.get(f.r).idx.push(f.i); }
  let n = 0;
  for (const [r, o] of byRing) {
    if (r.length / 2 <= 3) continue;
    tx.touch(o.p);
    for (const i of o.idx.sort((a, b) => b - a)) r.splice(i, 2);
    inval(o.p); n++;
  }
  if (n) tx.commit(); else toast('Sommet nécessaire (3 minimum)');
}

/* pinceau de fusion : tous les sommets sous le cercle sont fondus en un seul (barycentre).
   Un contour qui s'effondrerait (moins de 3 sommets restants) est épargné. */
const brush = { r: 18, x: null, y: null, mode: 'weld' };
const weldView = () => S.view === 'prov' || S.view === 'country' || S.view === 'region';   // Pays/Régions : fusion seulement   // rayon en pixels écran ; mode : 'weld' | 'del'
function weldAt(wx, wy, tx) {
  const r = brush.r / S.cam.s, r2 = r * r;
  const key = (x, y) => Math.round(x * 1e8) + ',' + Math.round(y * 1e8);
  const hits = [];
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (wx < bb[0] - r || wx > bb[2] + r || wy < bb[1] - r || wy > bb[3] + r) continue;
    for (const poly of p.polys) for (const ring of poly) {
      const idx = [];
      for (let i = 0; i < ring.length; i += 2) { const dx = ring[i] - wx, dy = ring[i + 1] - wy; if (dx * dx + dy * dy <= r2) idx.push(i); }
      if (idx.length) hits.push({ p, ring, idx });
    }
  }
  const prot = new Set();
  for (const h of hits) if (h.ring.length / 2 - h.idx.length < 2) for (const i of h.idx) prot.add(key(h.ring[i], h.ring[i + 1]));
  const pos = new Map();
  for (const h of hits) for (const i of h.idx) { const k = key(h.ring[i], h.ring[i + 1]); if (!prot.has(k) && !pos.has(k)) pos.set(k, [h.ring[i], h.ring[i + 1]]); }
  if (pos.size < 2) return 0;
  let sx = 0, sy = 0;
  for (const [x, y] of pos.values()) { sx += x; sy += y; }
  const tx_ = sx / pos.size, ty_ = sy / pos.size, ids = new Set();
  for (const h of hits) {
    let touched = false;
    for (const i of h.idx) {
      if (prot.has(key(h.ring[i], h.ring[i + 1]))) continue;
      if (!touched) { tx.touch(h.p); touched = true; }
      h.ring[i] = tx_; h.ring[i + 1] = ty_;
    }
    if (touched) ids.add(h.p.id);
  }
  dedupeRings(ids);
  return pos.size;
}

/* pinceau « Supprimer des sommets » : les sommets sous le cercle sont retirés, les voisins se relient en ligne droite.
   Un sommet n'est retiré que si tous les contours qui le portent ont les mêmes voisins (milieu d'une frontière
   partagée ou d'une côte) : les jonctions de 3 provinces et les bouts de frontière restent, donc ni trou ni chevauchement.
   Un contour garde toujours au moins 3 sommets. */
function vdelAt(wx, wy, tx) {
  const r = brush.r / S.cam.s, r2 = r * r;
  const key = (x, y) => Math.round(x * 1e8) + ',' + Math.round(y * 1e8);
  const rings = [];
  for (const p of S.provs.values()) {
    const bb = bbOf(p);
    if (wx < bb[0] - r || wx > bb[2] + r || wy < bb[1] - r || wy > bb[3] + r) continue;
    for (const poly of p.polys) for (const ring of poly) {
      for (let i = 0; i < ring.length; i += 2) { const dx = ring[i] - wx, dy = ring[i + 1] - wy; if (dx * dx + dy * dy <= r2) { rings.push({ p, ring }); break; } }
    }
  }
  const cand = new Map();   // clé -> [x, y]
  for (const h of rings) for (let i = 0; i < h.ring.length; i += 2) {
    const dx = h.ring[i] - wx, dy = h.ring[i + 1] - wy;
    if (dx * dx + dy * dy <= r2) cand.set(key(h.ring[i], h.ring[i + 1]), [h.ring[i], h.ring[i + 1]]);
  }
  const ids = new Set(); let n = 0;
  for (const [k] of cand) {
    const at = [];   // { h, i, nb } pour chaque contour qui porte ce sommet
    let ok = true, sig = null;
    for (const h of rings) {
      const L = h.ring.length;
      for (let i = 0; i < L; i += 2) {
        if (key(h.ring[i], h.ring[i + 1]) !== k) continue;
        if (L <= 6) { ok = false; break; }
        const a = (i - 2 + L) % L, b = (i + 2) % L;
        const nb = [key(h.ring[a], h.ring[a + 1]), key(h.ring[b], h.ring[b + 1])].sort().join('|');
        if (sig === null) sig = nb; else if (nb !== sig) { ok = false; break; }
        at.push({ h, i });
      }
      if (!ok) break;
    }
    if (!ok || !at.length) continue;
    for (const { h, i } of at.sort((u, v) => v.i - u.i)) { tx.touch(h.p); h.ring.splice(i, 2); ids.add(h.p.id); }
    n++;
  }
  for (const id of ids) inval(S.provs.get(id));
  return n;
}

/* outil Souder : les sommets des voisines qui sont presque (mais pas exactement) sur ceux de la province cliquée
   sont ramenés pile dessus. Un sommet déplacé entraîne tous ceux qui lui étaient identiques (3e province, etc.). */
let snapTol = 2;   // km sur la carte (ne dépend plus du zoom)
function snapClick(wx, wy) {
  const p = hitProv(wx, wy);
  if (!p) { toast('Clique sur une province'); return; }
  S.sel = p.id; syncUI();
  const tol = snapTol / 111.32, t2 = tol * tol;   // km -> degrés
  const key = (x, y) => Math.round(x * 1e8) + ',' + Math.round(y * 1e8);
  const bb = bbOf(p);
  const rings = [];                       // anneaux des provinces proches (hors p)
  for (const q of S.provs.values()) {
    if (q === p) continue;
    const b = bbOf(q);
    if (b[2] < bb[0] - tol || b[0] > bb[2] + tol || b[3] < bb[1] - tol || b[1] > bb[3] + tol) continue;
    for (const poly of q.polys) for (const ring of poly) rings.push({ q, ring });
  }
  const grid = new Map(), cs = tol || 1e-9;
  const gk = (x, y) => Math.floor(x / cs) + ',' + Math.floor(y / cs);
  for (const r of rings) for (let i = 0; i < r.ring.length; i += 2) {
    const k = gk(r.ring[i], r.ring[i + 1]); let a = grid.get(k); if (!a) grid.set(k, a = []); a.push([r.ring[i], r.ring[i + 1]]);
  }
  const own = new Set();
  for (const poly of p.polys) for (const ring of poly) for (let i = 0; i < ring.length; i += 2) own.add(key(ring[i], ring[i + 1]));
  const target = new Map();               // clé du sommet voisin -> [x, y] cible
  const best = new Map();
  for (const poly of p.polys) for (const ring of poly) for (let i = 0; i < ring.length; i += 2) {
    const x = ring[i], y = ring[i + 1], cx = Math.floor(x / cs), cy = Math.floor(y / cs);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const a = grid.get((cx + dx) + ',' + (cy + dy)); if (!a) continue;
      for (const [vx, vy] of a) {
        const k = key(vx, vy); if (own.has(k)) continue;
        const d = (vx - x) * (vx - x) + (vy - y) * (vy - y);
        if (d <= t2 && (!best.has(k) || d < best.get(k))) { best.set(k, d); target.set(k, [x, y]); }
      }
    }
  }
  if (!target.size) { toast('Rien à souder (sommets déjà collés ou trop loin)'); return; }
  const tx = new Tx(), ids = new Set(); let n = 0;
  for (const r of rings) {
    let touched = false;
    for (let i = 0; i < r.ring.length; i += 2) {
      const t = target.get(key(r.ring[i], r.ring[i + 1]));
      if (!t) continue;
      if (!touched) { tx.touch(r.q); touched = true; }
      r.ring[i] = t[0]; r.ring[i + 1] = t[1]; n++;
    }
    if (touched) ids.add(r.q.id);
  }
  dedupeRings(ids);
  tx.commit(); G.geomDirty = G.asgnDirty = true; need();
  toast(target.size + ' sommets soudés (' + ids.size + ' provinces voisines) — Ctrl+Z pour annuler');
}
function weldDown(wx, wy) {
  if (brush.mode === 'del' && S.view === 'prov') { act = { kind: 'brushdel', ids: new Set() }; delCollect(wx, wy); return; }
  act = { kind: 'weld', tx: new Tx(), n: 0, lx: wx, ly: wy, vdel: brush.mode === 'vdel' };
  act.n += act.vdel ? vdelAt(wx, wy, act.tx) : weldAt(wx, wy, act.tx);
}

/* mode « Supprimer » : en restant cliqué, toutes les provinces touchées par le cercle sont sélectionnées ;
   elles sont supprimées d'un coup au relâchement (une seule annulation). */
function brushTouches(p, wx, wy, r) {
  const bb = bbOf(p);
  if (wx < bb[0] - r || wx > bb[2] + r || wy < bb[1] - r || wy > bb[3] + r) return false;
  const r2 = r * r;
  for (const poly of p.polys) {
    for (const ring of poly) {
      const n = ring.length;
      for (let i = 0, j = n - 2; i < n; j = i, i += 2) {
        const ax = ring[j], ay = ring[j + 1], bx = ring[i], by = ring[i + 1];
        const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
        let t = l2 ? ((wx - ax) * dx + (wy - ay) * dy) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
        const ex = ax + t * dx - wx, ey = ay + t * dy - wy;
        if (ex * ex + ey * ey <= r2) return true;
      }
    }
    const pb = C.polyBBox(poly);
    if (wx >= pb[0] && wx <= pb[2] && wy >= pb[1] && wy <= pb[3] && C.pointInPoly(wx, wy, poly)) return true;
  }
  return false;
}
function delCollect(wx, wy) {
  const r = brush.r / S.cam.s, before = act.ids.size;
  for (const p of S.provs.values()) if (!act.ids.has(p.id) && brushTouches(p, wx, wy, r)) act.ids.add(p.id);
  if (act.ids.size !== before) need();
}
function delFinish(a) {
  if (!a.ids.size) { need(); return; }
  const tx = new Tx();
  for (const id of a.ids) { const p = S.provs.get(id); if (p) { tx.touch(p); S.provs.delete(id); } }
  if (!S.provs.has(S.sel)) S.sel = 0;
  G.geomDirty = G.asgnDirty = true;
  tx.commit(); need();
  toast(a.ids.size + ' province(s) supprimée(s) — Ctrl+Z pour annuler');
}
function weldMove(wx, wy) {
  if (Math.hypot(wx - act.lx, wy - act.ly) * S.cam.s < brush.r * 0.4) return;
  act.lx = wx; act.ly = wy;
  act.n += act.vdel ? vdelAt(wx, wy, act.tx) : weldAt(wx, wy, act.tx);
}

/* ===================================================================== outils : assignation / pipette / terrain */
function paintApply(p, right) {
  const t = act.tx;
  let changed = false;
  if (S.view === 'country') {
    const v = right ? 0 : S.actC;
    if (!right && !S.actC) { toast('Choisis d’abord un pays'); return; }
    if (p.country !== v) { t.touch(p); p.country = v; changed = true; }
  } else if (S.view === 'region') {
    const v = right ? 0 : S.actR;
    if (!right && !S.actR) { toast('Crée ou choisis d’abord une région'); return; }
    if (p.region !== v) { t.touch(p); p.region = v; changed = true; }
  } else if (S.view === 'air' || S.view === 'naval') {
    const v = right ? 0 : S.actZ;
    if (S.view === 'naval' && terrType(p) !== 'sea') return;   // vue navale : seulement les mers
    if (!right && !S.actZ) { toast(S.view === 'naval' ? 'Crée ou choisis d’abord une zone navale' : 'Crée ou choisis d’abord une zone aérienne'); return; }
    if (p.region && act.lastR === p.region && act.lastV === v) return;   // même région pendant le glisser
    act.lastR = p.region; act.lastV = v;
    for (const q of airGroup(p)) if ((q.air || 0) !== v) { t.touch(q); if (v) q.air = v; else delete q.air; changed = true; }
  } else if (S.view === 'terrain') {
    const v = right ? NOT_SET : S.pen;
    if (p.terrain !== v) { t.touch(p); p.terrain = v; changed = true; }
  }
  if (changed) { G.asgnDirty = true; act.changed = true; need(); }
}
function paintDown(e, px, py, wx, wy, right) {
  act = { kind: 'paint', tx: new Tx(), right, changed: false };
  const p = hitProv(wx, wy);
  if (p) paintApply(p, right);
}
function paintMove(wx, wy) {
  const p = hitProv(wx, wy);
  if (p) paintApply(p, act.right);
}
function pipetteAt(wx, wy) {
  const p = hitProv(wx, wy);
  if (!p) return;
  if (S.view === 'country' && p.country) S.actC = p.country;
  else if (S.view === 'region' && p.region) S.actR = p.region;
  else if ((S.view === 'air' || S.view === 'naval') && p.air) S.actZ = p.air;
  else if (S.view === 'terrain' && p.terrain !== NOT_SET) S.pen = p.terrain;
  syncUI();
}

/* ===================================================================== zones aériennes (régions stratégiques de HOI4) */
// Dans HOI4 une région stratégique regroupe des états (régions ici) ; elle sert aux missions aériennes, à la supériorité
// aérienne, à la météo et, en mer, aux zones navales. Ici : p.air = id de zone sur chaque province ; on assigne par région
// entière (une mer sans région = province seule). Import : hoi4_airzones.js (grilles lat/lon 0,25° des régions de HOI4,
// terre et mer séparées), zone majoritaire sous chaque région.
const airGroup = p => p.region ? [...S.provs.values()].filter(q => q.region === p.region) : [p];
const airNeeds = p => { const t = terrType(p); return t === 'land' || t === 'sea'; };   // lacs / infranchissable : pas de zone

function airZonesTx(fn) {
  const before = [...S.zones.values()].map(z => ({ ...z })), tx = new Tx();
  fn(tx);
  const after = [...S.zones.values()].map(z => ({ ...z }));
  if (!tx.commit()) { S.undo.push([]); S.redo.length = 0; }
  S.undo[S.undo.length - 1].push({ zones: true, before, after });
  G.asgnDirty = true; markDirty(); syncUI(); need();
}

function airGo(zid, rid) {
  const bb = [Infinity, Infinity, -Infinity, -Infinity];
  for (const p of S.provs.values()) if (zid ? p.air === zid : p.region === rid) { const b = bbOf(p); bb[0] = Math.min(bb[0], b[0]); bb[1] = Math.min(bb[1], b[1]); bb[2] = Math.max(bb[2], b[2]); bb[3] = Math.max(bb[3], b[3]); }
  if (isFinite(bb[0])) zoomTo(bb); else toast('Aucune province');
}

function airBilan(all) {
  if (!S.zones.size) return [];
  const used = new Set(all.map(p => p.air)), split = new Map();
  for (const p of all) if (p.region) { let s = split.get(p.region); if (!s) split.set(p.region, s = new Set()); s.add(p.air || 0); }
  return [
    { t: 'Provinces sans zone aérienne', warn: true, items: all.filter(p => !p.air && airNeeds(p)).map(p => ({ k: 'p', id: p.id, t: p.name })) },
    { t: 'Régions partagées entre plusieurs zones aériennes', warn: true, items: [...split].filter(([, s]) => s.size > 1).map(([rid]) => ({ k: 'rz', id: rid, t: (S.regions.get(rid) || { name: 'Région ' + rid }).name })) },
    { t: 'Zones aériennes vides', warn: false, items: [...S.zones.values()].filter(z => !used.has(z.id)).map(z => ({ k: 'az', id: z.id, t: z.name })) },
  ];
}

function airDecode() {
  const A = window.HOI4_AIRZONES;
  if (!A) return null;
  if (!A._land) for (const k of ['land', 'sea']) {
    const g = new Int16Array(A.w * A.h), r = A[k];
    for (let i = 0, o = 0; i < r.length; i += 2) { g.fill(r[i], o, o + r[i + 1]); o += r[i + 1]; }
    A['_' + k] = g;
  }
  if (!A._names) A._names = new Map(A.regions.map(r => [r[0], { name: r[1], sea: !!r[2] }]));
  return A;
}

// Remplit seulement ce qui n'a pas encore de zone : pour chaque région (ou mer sans région), vote des cellules 0,25° de HOI4
// sous ses provinces (pondéré par la surface), grille terre pour la terre, grille mer pour la mer.
function airImportHoi4() {
  const A = airDecode();
  if (!A) { toast('hoi4_airzones.js introuvable'); return; }
  const cell = (g, lon, lat) => {
    const r = Math.min(A.h - 1, Math.max(0, Math.floor((90 - lat) / A.res)));
    const c = ((Math.floor((lon + 180) / A.res) % A.w) + A.w) % A.w;
    return g[r * A.w + c];
  };
  const groups = new Map();
  for (const p of S.provs.values()) {
    if (!airNeeds(p)) continue;
    const sea = terrType(p) === 'sea', key = !sea && p.region ? 'r' + p.region : 'p' + p.id;
    let gr = groups.get(key); if (!gr) groups.set(key, gr = { provs: [], votes: new Map(), taken: false });
    gr.provs.push(p); if (p.air) gr.taken = true;
    const g = sea ? A._sea : A._land, bb = bbOf(p);
    const add = (x, y, w) => { const h = cell(g, x, y); if (h) gr.votes.set(h, (gr.votes.get(h) || 0) + w); };
    let st = A.res; while ((bb[2] - bb[0]) * (bb[3] - bb[1]) / (st * st) > 400) st *= 2;   // ≤ ~400 points par province
    let n = 0;
    for (let x = (Math.floor(bb[0] / st) + 0.5) * st; x < bb[2]; x += st)
      for (let y = (Math.floor(bb[1] / st) + 0.5) * st; y < bb[3]; y += st)
        if (p.polys.some(pl => C.pointInPoly(x, y, pl))) { add(x, y, st * st); n++; }
    if (!n) add((bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2, 1e-4);   // petite province : son centre
  }
  let nz = 0, ng = 0;
  airZonesTx(tx => {
    const byH = new Map([...S.zones.values()].filter(z => z.hoi4).map(z => [z.hoi4, z.id]));
    for (const gr of groups.values()) {
      if (gr.taken || !gr.votes.size) continue;
      const h = [...gr.votes].sort((a, b) => b[1] - a[1])[0][0];
      let zid = byH.get(h);
      if (!zid) {
        const info = A._names.get(h) || { name: 'Zone HOI4 ' + h, sea: false };
        zid = S.nextZone++;
        S.zones.set(zid, { id: zid, name: info.name, color: info.sea ? C.hsl((h * 47) % 360, 45, 38) : C.autoColor(h * 7 + 3), hoi4: h, sea: info.sea });
        byH.set(h, zid); nz++;
      }
      for (const p of gr.provs) { tx.touch(p); p.air = zid; }
      ng++;
    }
  });
  const left = [...S.provs.values()].filter(p => !p.air && airNeeds(p)).length;
  toast(ng + ' régions / mers rangées, ' + nz + ' zones de HOI4 créées' + (left ? ' · ' + left + ' provinces encore sans zone' : '') + ' — Ctrl+Z annule');
}

function airExport(provs) {
  const zones = [...S.zones.values()].sort((a, b) => a.id - b.id).map(z => {
    const ps = provs.filter(p => p.air === z.id);
    const regions = [...new Set(ps.map(p => p.region).filter(Boolean))].sort((a, b) => a - b);
    const sea = ps.filter(p => terrType(p) === 'sea').length > ps.length / 2;
    return { id: z.id, name: z.name, color: z.color, hoi4: z.hoi4 || 0, sea, regions, provinces: ps.map(p => p.id) };
  }).filter(z => z.provinces.length);
  return { format: 1, source: 'BoP Map Editor (zones aériennes)', zones };
}

function airPanel(el, naval) {
  if (naval) return navalPanel(el);
  const cur = S.zones.get(S.actZ);
  let nR = 0, nP = 0;
  if (cur) { const rs = new Set(); for (const p of S.provs.values()) if (p.air === cur.id) { nP++; if (p.region) rs.add(p.region); } nR = rs.size; }
  const left = [...S.provs.values()].filter(p => !p.air && airNeeds(p)).length;
  el.innerHTML = `<h3>Zones aériennes</h3>
    <div class="kv">Comme les régions stratégiques de HOI4 : une zone = un groupe de régions (missions aériennes, supériorité aérienne, météo ; en mer : zones navales).</div>
    <div class="row"><select id="cSel">${opts(byName(S.zones), cur ? cur.id : 0, '— choisir —')}</select><button id="cUp" title="Précédente (ordre alphabétique)" style="flex:none;padding:4px 7px">▲</button><button id="cDn" title="Suivante (ordre alphabétique)" style="flex:none;padding:4px 7px">▼</button><button id="cAdd" title="Nouvelle zone" style="flex:none">＋</button></div>
    ${cur ? `<div class="row"><input type="color" id="cCol" value="${cur.color}"><input type="text" id="cName" value="${esc(cur.name)}"></div>
    <div class="kv">${nR} région${nR > 1 ? 's' : ''} · ${nP} province${nP > 1 ? 's' : ''}${cur.hoi4 ? ' · HOI4 n° ' + cur.hoi4 : ''}</div>
    <div class="row"><button id="cGo">Voir</button><button id="cDel" class="danger">Supprimer cette zone</button></div>` : ''}
    <div class="row"><label style="width:auto"><input type="checkbox" id="cOv" ${S.overlayCountry ? 'checked' : ''}> pays en transparence</label></div>
    <h3>HOI4</h3>
    <div class="row"><button id="zImp">Importer les zones de HOI4</button></div>
    <div class="kv">Ne touche qu’aux régions et mers encore sans zone : chacune prend la région stratégique de HOI4 majoritaire sous elle (bords approximatifs, à corriger à la main). Ctrl+Z annule.</div>
    <div class="kv">${S.zones.size} zone${S.zones.size > 1 ? 's' : ''} · ${left} province${left > 1 ? 's' : ''} sans zone</div>`;
  $('#cSel').onchange = e => { S.actZ = +e.target.value; syncUI(); need(); };
  const step = d => {
    const list = byName(S.zones); if (!list.length) return;
    const i = list.findIndex(o => o.id === (cur ? cur.id : 0));
    S.actZ = list[i < 0 ? (d > 0 ? 0 : list.length - 1) : (i + d + list.length) % list.length].id; syncUI(); need();
  };
  $('#cUp').onclick = () => step(-1);
  $('#cDn').onclick = () => step(1);
  $('#cAdd').onclick = () => airZonesTx(() => { const id = S.nextZone++; S.zones.set(id, { id, name: 'Nouvelle zone', color: C.autoColor(id * 7 + 3), hoi4: 0 }); S.actZ = id; });
  $('#zImp').onclick = airImportHoi4;
  $('#cOv').onchange = e => { S.overlayCountry = e.target.checked; need(); };
  if (!cur) return;
  $('#cCol').oninput = e => { cur.color = e.target.value; need(); };
  $('#cCol').onchange = markDirty;
  $('#cName').onchange = e => { cur.name = e.target.value.trim() || cur.name; markDirty(); syncUI(); need(); };
  $('#cGo').onclick = () => airGo(cur.id);
  $('#cDel').onclick = () => {
    const b = $('#cDel');
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Confirmer la suppression'; return; }
    airZonesTx(tx => { for (const p of S.provs.values()) if (p.air === cur.id) { tx.touch(p); delete p.air; } S.zones.delete(cur.id); S.actZ = 0; });
  };
}

/* ===================================================================== zones navales (vue 7) */
// Mêmes zones que les zones aériennes (dans HOI4 une région stratégique de mer sert aux deux : missions navales,
// supériorité navale, météo) ; cette vue ne montre que les mers : régions de mer en traits fins, zones en traits épais.
// Les mers sont regroupées en régions de mer (vue Régions, ou tools/make_sea_regions.py) : un clic range toute la région.
const NAVAL_LAND = '#7d7564';
function mixedRegions(all) {
  const k = new Map();
  for (const p of all) if (p.region) { const t = terrType(p); if (t !== 'land' && t !== 'sea') continue; let m = k.get(p.region); if (!m) k.set(p.region, m = new Set()); m.add(t); }
  return [...k].filter(([, m]) => m.size > 1).map(([rid]) => ({ k: 'rg', id: rid, t: (S.regions.get(rid) || { name: 'Région ' + rid }).name }));
}
function navalPanel(el) {
  const seaZ = new Map([...S.zones].filter(([, z]) => z.sea));
  const cur = seaZ.get(S.actZ);
  let nR = 0, nP = 0;
  if (cur) { const rs = new Set(); for (const p of S.provs.values()) if (p.air === cur.id && terrType(p) === 'sea') { nP++; if (p.region) rs.add(p.region); } nR = rs.size; }
  const seas = [...S.provs.values()].filter(p => terrType(p) === 'sea');
  const left = seas.filter(p => !p.air).length, noReg = seas.filter(p => !p.region).length;
  const nSR = new Set(seas.map(p => p.region).filter(Boolean)).size;
  el.innerHTML = `<h3>Zones navales</h3>
    <div class="kv">Comme les régions stratégiques de mer de HOI4 : une zone = un groupe de régions de mer (missions navales, supériorité navale, météo). Ce sont les mêmes zones que les zones aériennes en mer.</div>
    <div class="row"><select id="cSel">${opts(byName(seaZ), cur ? cur.id : 0, '— choisir —')}</select><button id="cUp" title="Précédente (ordre alphabétique)" style="flex:none;padding:4px 7px">▲</button><button id="cDn" title="Suivante (ordre alphabétique)" style="flex:none;padding:4px 7px">▼</button><button id="cAdd" title="Nouvelle zone navale" style="flex:none">＋</button></div>
    ${cur ? `<div class="row"><input type="color" id="cCol" value="${cur.color}"><input type="text" id="cName" value="${esc(cur.name)}"></div>
    <div class="kv">${nR} région${nR > 1 ? 's' : ''} de mer · ${nP} mer${nP > 1 ? 's' : ''}${cur.hoi4 ? ' · HOI4 n° ' + cur.hoi4 : ''}</div>
    <div class="row"><button id="cGo">Voir</button><button id="cDel" class="danger">Supprimer cette zone</button></div>` : ''}
    <h3>HOI4</h3>
    <div class="row"><button id="zImp">Importer les zones de HOI4</button></div>
    <div class="kv">Ne touche qu’aux mers encore sans zone (et aux régions de terre sans zone). Ctrl+Z annule.</div>
    <div class="kv">${seaZ.size} zone${seaZ.size > 1 ? 's' : ''} navale${seaZ.size > 1 ? 's' : ''} · ${seas.length} mers en ${nSR} régions · ${left} mer${left > 1 ? 's' : ''} sans zone · ${noReg} sans région</div>`;
  $('#cSel').onchange = e => { S.actZ = +e.target.value; syncUI(); need(); };
  const step = d => {
    const list = byName(seaZ); if (!list.length) return;
    const i = list.findIndex(o => o.id === (cur ? cur.id : 0));
    S.actZ = list[i < 0 ? (d > 0 ? 0 : list.length - 1) : (i + d + list.length) % list.length].id; syncUI(); need();
  };
  $('#cUp').onclick = () => step(-1);
  $('#cDn').onclick = () => step(1);
  $('#cAdd').onclick = () => airZonesTx(() => { const id = S.nextZone++; S.zones.set(id, { id, name: 'Nouvelle zone navale', color: C.hsl((id * 47) % 360, 45, 38), hoi4: 0, sea: true }); S.actZ = id; });
  $('#zImp').onclick = airImportHoi4;
  if (!cur) return;
  $('#cCol').oninput = e => { cur.color = e.target.value; need(); };
  $('#cCol').onchange = markDirty;
  $('#cName').onchange = e => { cur.name = e.target.value.trim() || cur.name; markDirty(); syncUI(); need(); };
  $('#cGo').onclick = () => airGo(cur.id);
  $('#cDel').onclick = () => {
    const b = $('#cDel');
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Confirmer la suppression'; return; }
    airZonesTx(tx => { for (const p of S.provs.values()) if (p.air === cur.id) { tx.touch(p); delete p.air; } S.zones.delete(cur.id); S.actZ = 0; });
  };
}

/* ===================================================================== détroits (adjacences du jeu, façon HOI4) */
// Un détroit relie deux provinces de terre qui ne se touchent pas : les armées passent sans bateau. Dessin comme HOI4
// (map/terrain/strait.dds : tirets rouge sombre 46,4,5 à 75 %, liseré à 50 %, 3/4 plein). Points en [lon, lat] : le jeu retrouve
// lui-même les provinces dessous (et la mer traversée = milieu du trait). Types : sea (détroit), river / river_large (rivière
// entre deux voisines : pénalité d'attaque), impassable (coupe deux voisines).
const STRAIT_TYPES = { sea: 'Détroit (sans bateau)', river: 'Rivière', river_large: 'Grande rivière', impassable: 'Infranchissable' };
var strait = { a: null, hover: null, sel: 0 };   // a = 1er clic en attente du 2e
const isLandProv = p => !!p && (p.terrain === NOT_SET || TERRAINS[p.terrain][2] === 'land');
const straitById = id => S.straits.find(s => s.id === id);

// Modification annulable de la liste des détroits (une entrée d'annulation à part, sans toucher aux provinces).
function straitTx(fn, before) {
  const b = before || JSON.stringify(S.straits);
  fn();
  const a = JSON.stringify(S.straits);
  if (a === b) return false;
  S.undo.push([{ straits: true, before: JSON.parse(b), after: JSON.parse(a) }]);
  if (S.undo.length > 60) S.undo.shift();
  S.redo.length = 0; markDirty(); syncUI(); need();
  return true;
}

// Ce que le jeu verra : provinces sous chaque bout, problèmes éventuels.
function straitInfo(st) {
  const A = hitProv(st.a[0], st.a[1]), B = hitProv(st.b[0], st.b[1]);
  let warn = '';
  if (!isLandProv(A) || !isLandProv(B)) warn = 'un bout n’est pas sur une province de terre';
  else if (A === B) warn = 'les deux bouts sont dans la même province (lien inutile ?)';
  if (warn) return { A, B, warn, same: !!A && A === B };
  return { A, B, warn };
}

// Point sur la terre : s'il tombe dans l'eau, la terre la plus proche (anneaux jusqu'à 0,4°, comme le jeu au chargement).
function snapLand(pt, avoid) {
  const ok = q => isLandProv(q) && q !== avoid;
  if (ok(hitProv(pt[0], pt[1]))) return pt;
  for (let r = 0.01; r <= 0.401; r += 0.01)
    for (let k = 0; k < 24; k++) {
      const a = k * Math.PI / 12, q = [pt[0] + r * Math.cos(a) / Math.max(0.2, Math.cos(pt[1] * Math.PI / 180)), pt[1] + r * Math.sin(a)];
      if (ok(hitProv(q[0], q[1]))) return q;
    }
  return pt;
}

function straitHit(px, py) {
  let best = 0, bd = 8;
  for (const st of S.straits) {
    const [ax, ay] = w2s(st.a[0], st.a[1]), [bx, by] = w2s(st.b[0], st.b[1]);
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
    const d = Math.hypot(px - ax - t * dx, py - ay - t * dy);
    if (d < bd) { bd = d; best = st.id; }
  }
  return best;
}

function straitDown(e, px, py, wx, wy, right) {
  if (right) { if (strait.a) strait.a = null; else strait.sel = 0; syncUI(); need(); return; }
  const sel = straitById(strait.sel);
  if (sel && !strait.a) {
    for (const end of ['a', 'b']) {
      const [sx, sy] = w2s(sel[end][0], sel[end][1]);
      if (Math.hypot(px - sx, py - sy) < 9) { act = { kind: 'sdrag', st: sel, end, before: JSON.stringify(S.straits) }; return; }
    }
  }
  if (strait.a) {
    const A = hitProv(strait.a[0], strait.a[1]), B = hitProv(wx, wy);
    if (!isLandProv(B)) { toast('Clique une province de terre pour l’autre rive'); return; }
    if (A === B) { toast('Même province : clique l’autre rive'); return; }
    const a = strait.a; strait.a = null;
    straitTx(() => {
      const st = { id: S.nextStrait++, a, b: [wx, wy], type: 'sea', name: '', rule: '' };
      S.straits.push(st); strait.sel = st.id;
    });
    toast('Détroit créé : ' + A.name + ' ↔ ' + B.name);
    return;
  }
  const hit = straitHit(px, py);
  if (hit) { strait.sel = hit; syncUI(); need(); return; }
  const p = hitProv(wx, wy);
  if (isLandProv(p)) { strait.a = [wx, wy]; strait.hover = [wx, wy]; strait.sel = 0; syncUI(); need(); }
  else { strait.sel = 0; syncUI(); need(); }
}

function straitDelete() {
  if (!strait.sel) return;
  straitTx(() => { S.straits = S.straits.filter(s => s.id !== strait.sel); strait.sel = 0; });
}

// Détroits de HOI4 (hoi4_straits.js) : ajoute ceux qui n'existent pas déjà (mêmes bouts à ~10 km près). Ensuite, c'est la liste
// de l'éditeur qui fait foi dans le jeu (export : replace_hoi4_straits).
function straitImportHoi4() {
  const list = window.HOI4_STRAITS || [];
  const near = (p, q) => Math.abs(p[0] - q[0]) < 0.1 && Math.abs(p[1] - q[1]) < 0.1;
  let n = 0;
  straitTx(() => {
    const done = new Set(S.straits.map(s => s.h));   // liens de HOI4 déjà présents (numéro dans HOI4_STRAITS)
    for (let i = 0; i < list.length; i++) {
      const h = list[i];
      if (done.has(i) || S.straits.some(s => (near(s.a, h.a) && near(s.b, h.b)) || (near(s.a, h.b) && near(s.b, h.a)))) continue;
      done.add(i);
      const a = snapLand(h.a), b = snapLand(h.b, hitProv(a[0], a[1]));   // bouts recollés sur la terre (côtes différentes de HOI4)
      S.straits.push({ id: S.nextStrait++, a: a.map(v => Math.round(v * 1e5) / 1e5), b: b.map(v => Math.round(v * 1e5) / 1e5), type: h.type, name: h.name || '', rule: h.rule || '', h: i });
      n++;
    }
    S.straitsFromHoi4 = true;
  });
  const bad = S.straits.filter(s => straitInfo(s).warn).length;
  toast(n + ' détroits de HOI4 ajoutés' + (bad ? ' · ' + bad + ' à corriger (bout rouge)' : ''));
}

// Dessin (repère monde : 1 px écran = px).
function straitDraw(c, px) {
  if (!S.straits.length && !strait.a) return;
  const onTool = S.view === 'prov' && S.tool === 'strait';
  if (!onTool && !S.showStraits) return;
  const w = Math.max(2.5, Math.min(6, 0.5 * S.cam.s * 0.08)) * px;   // épaisseur à l'écran : 2,5 à 6 px selon le zoom
  c.lineCap = 'butt';
  const seg = (a, b, col, edge, width, dash) => {
    c.setLineDash(dash ? [dash * 0.75, dash * 0.25] : []);
    c.lineDashOffset = -dash * 0.125;
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
    c.strokeStyle = edge; c.lineWidth = width + 1.6 * px; c.stroke();
    c.strokeStyle = col; c.lineWidth = width; c.stroke();
  };
  for (const st of S.straits) {
    const col = st.type === 'sea' ? 'rgba(46,4,5,.85)' : st.type === 'impassable' ? 'rgba(200,40,170,.85)' : 'rgba(40,110,220,.85)';
    const edge = 'rgba(255,236,220,.45)';   // liseré clair : HOI4 n'en a pas besoin (mer claire), ici le fond est sombre
    if (st.id === strait.sel) seg(st.a, st.b, 'rgba(0,0,0,0)', '#ffe14d', w + 3 * px, 0);
    seg(st.a, st.b, col, edge, st.type === 'sea' ? w : w * 0.7, w * 2.6);
  }
  if (strait.a && strait.hover) seg(strait.a, strait.hover, 'rgba(46,4,5,.85)', 'rgba(255,236,220,.45)', w, w * 2.6);
  c.setLineDash([]);
}

// Couche écran : poignées du détroit choisi, bouts à corriger.
function straitDrawScreen(c) {
  const onTool = S.view === 'prov' && S.tool === 'strait';
  if (!onTool) return;
  for (const st of S.straits) {
    const info = st.id === strait.sel || S.straits.length < 400 ? straitInfo(st) : null;
    for (const end of ['a', 'b']) {
      const [sx, sy] = w2s(st[end][0], st[end][1]);
      if (sx < -10 || sy < -10 || sx > W + 10 || sy > H + 10) continue;
      const p = info ? (end === 'a' ? info.A : info.B) : null;
      const bad = info && (!isLandProv(p) || info.A === info.B);
      if (st.id === strait.sel || bad) {
        c.beginPath(); c.arc(sx, sy, st.id === strait.sel ? 6 : 5, 0, 6.2832);
        c.fillStyle = bad ? '#ff3b3b' : '#ffe14d'; c.fill();
        c.strokeStyle = '#000'; c.lineWidth = 1; c.stroke();
      }
    }
  }
  if (strait.a) { const [sx, sy] = w2s(strait.a[0], strait.a[1]); c.beginPath(); c.arc(sx, sy, 5, 0, 6.2832); c.fillStyle = '#ffe14d'; c.fill(); }
}

function straitPanel() {
  const st = straitById(strait.sel);
  const n = S.straits.length, bad = S.straits.filter(s => straitInfo(s).warn).length;
  let h = `<h3>Détroits</h3>
    <div class="kv">${n} lien${n > 1 ? 's' : ''}${bad ? ` · <b style="color:#ff6b6b">${bad} à corriger</b>` : ''}${S.straitsFromHoi4 ? ' · liste importée de HOI4 (elle remplace celle du jeu)' : ''}</div>
    <div class="row"><button id="stImp" title="Ajoute les détroits de HOI4 qui manquent (positions réelles) ; tu corriges ensuite">Importer les détroits de HOI4</button></div>
    ${bad ? `<div class="row"><button id="stNext" title="Choisit et montre le prochain lien à corriger">Suivant à corriger ▶</button><button id="stSame" title="Supprime les liens dont les deux bouts sont dans la même province (îles d’une même province…)">Retirer les inutiles</button></div>` : ''}
    <div class="row"><label style="width:auto"><input type="checkbox" id="stShow" ${S.showStraits ? 'checked' : ''}> afficher dans toutes les vues</label></div>`;
  if (st) {
    const { A, B, warn } = straitInfo(st);
    const rules = window.HOI4_RULES || [];
    h += `<h3>Lien #${st.id}</h3>
      <div class="kv">${A ? esc(A.name) : '—'} ↔ ${B ? esc(B.name) : '—'}</div>
      ${warn ? `<div class="kv" style="color:#ff6b6b">⚠ ${warn} : déplace le bout rouge</div>` : ''}
      <div class="row"><label>Type</label><select id="stType">${Object.entries(STRAIT_TYPES).map(([k, v]) => `<option value="${k}" ${st.type === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="row"><label>Nom</label><input type="text" id="stName" value="${esc(st.name || '')}"></div>
      <div class="row"><label>Règle</label><select id="stRule"><option value="">— aucune —</option>${rules.map(r => `<option value="${r.name}" ${st.rule === r.name ? 'selected' : ''}>${esc(r.fr)}</option>`).join('')}</select></div>
      <div class="row"><button id="stGo">Voir</button><button id="stDel" class="danger">Supprimer (Suppr)</button></div>`;
  } else h += `<div class="kv">Aucun lien choisi.</div>`;
  const named = S.straits.filter(s => s.name).sort((a, b) => a.name.localeCompare(b.name));
  if (named.length) h += `<h3>Liste</h3><div class="row" style="flex-wrap:wrap;max-height:220px;overflow:auto">${named.map(s => `<button data-st="${s.id}" style="flex:none;font-size:11px;padding:2px 6px">${esc(s.name)}</button>`).join('')}</div>`;
  return h;
}
function straitBind() {
  const go = st => { S.cam.x = (st.a[0] + st.b[0]) / 2; S.cam.y = (st.a[1] + st.b[1]) / 2; S.cam.s = Math.max(S.cam.s, 120); need(); };
  $('#stImp').onclick = straitImportHoi4;
  $('#stShow').onchange = e => { S.showStraits = e.target.checked; markDirty(); need(); };
  if ($('#stNext')) {
    $('#stNext').onclick = () => {
      const bad = S.straits.filter(s => straitInfo(s).warn);
      const i = bad.findIndex(s => s.id === strait.sel);
      const nx = bad[(i + 1) % bad.length];
      if (nx) { strait.sel = nx.id; go(nx); syncUI(); }
    };
    $('#stSame').onclick = () => {
      const k = S.straits.length;
      straitTx(() => { S.straits = S.straits.filter(s => !straitInfo(s).same); if (!straitById(strait.sel)) strait.sel = 0; });
      toast((k - S.straits.length) + ' liens inutiles retirés');
    };
  }
  for (const b of $('#panel').querySelectorAll('[data-st]')) b.onclick = () => { strait.sel = +b.dataset.st; go(straitById(strait.sel)); syncUI(); };
  const st = straitById(strait.sel);
  if (!st) return;
  $('#stType').onchange = e => straitTx(() => { st.type = e.target.value; });
  $('#stName').onchange = e => straitTx(() => { st.name = e.target.value.trim(); });
  $('#stRule').onchange = e => straitTx(() => { st.rule = e.target.value; });
  $('#stGo').onclick = () => go(st);
  $('#stDel').onclick = straitDelete;
}

// Export pour le jeu (data/adjacencies.json) : [lat, lon] ; mer traversée = milieu du trait (le jeu prend la mer la plus proche).
function straitExport() {
  const ll = p => [Math.round(p[1] * 1e4) / 1e4, Math.round(p[0] * 1e4) / 1e4];
  return {
    source: 'BoP Map Editor (outil Détroits)', replace_hoi4_straits: !!S.straitsFromHoi4,
    adjacencies: S.straits.map(st => ({
      type: st.type, from: ll(st.a), to: ll(st.b),
      through: st.type === 'sea' ? ll([(st.a[0] + st.b[0]) / 2, (st.a[1] + st.b[1]) / 2]) : null,
      rule: st.rule || '', comment: st.name || '',
    })),
  };
}

/* ===================================================================== entrées pointeur */
let act = null, spaceDown = false, lastPen = 0, gesture = null;
const ptrs = new Map();

function toolDown(e, px, py) {
  const [wx, wy] = s2w(px, py), right = e.button === 2;
  if (S.view === 'bg') { if (S.tool === 'bgmove') bgHit(px, py, wx, wy, e); else if (S.tool === 'vec') vecDown(wx, wy, e); return; }
  if (S.view === 'prov') {
    if (S.tool === 'select') { const p = hitProv(wx, wy); S.sel = p ? p.id : 0; syncUI(); need(); }
    else if (S.tool === 'poly') polyDown(px, py, wx, wy, right);
    else if (S.tool === 'cut') cutDown(e, px, py, wx, wy, right);
    else if (S.tool === 'merge') mergeClick(wx, wy);
    else if (S.tool === 'fill' && !right) fillDown(wx, wy);
    else if (S.tool === 'detach' && !right) detachClick(wx, wy);
    else if (S.tool === 'mergepart' && !right) mergePartClick(wx, wy);
    else if (S.tool === 'vertex') vertexDown(e, px, py, wx, wy, right);
    else if (S.tool === 'weld' && !right) weldDown(wx, wy);
    else if (S.tool === 'snap' && !right) snapClick(wx, wy);
    else if (S.tool === 'strait') straitDown(e, px, py, wx, wy, right);
  } else if (S.tool === 'weld') { if (!right) weldDown(wx, wy); }
  else if (S.tool === 'pipette') pipetteAt(wx, wy);
  else paintDown(e, px, py, wx, wy, right);
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (e.pointerType === 'pen') lastPen = performance.now();
  if (e.pointerType === 'touch' && performance.now() - lastPen < 2500) return; // paume
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* pointeur synthétique */ }
  ptrs.set(e.pointerId, { x: px, y: py, type: e.pointerType });
  const touches = [...ptrs.values()].filter(p => p.type === 'touch');
  if (touches.length >= 2) {
    abortAct();
    const [a, b] = touches, d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    gesture = { d0: d, s0: S.cam.s, g: s2w(cx, cy) };
    return;
  }
  if (e.button === 1 || spaceDown || S.tool === 'hand') { act = { kind: 'pan', lx: px, ly: py }; cv.style.cursor = 'grabbing'; return; }
  toolDown(e, px, py);
});

cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const [wx, wy] = s2w(px, py);
  $('#coords').textContent = wx.toFixed(3) + '°  ' + wy.toFixed(3) + '°';
  const pt = ptrs.get(e.pointerId);
  if (pt) { pt.x = px; pt.y = py; }
  if (gesture) {
    const t = [...ptrs.values()].filter(p => p.type === 'touch');
    if (t.length >= 2) {
      const d = Math.hypot(t[0].x - t[1].x, t[0].y - t[1].y) || 1;
      const cx = (t[0].x + t[1].x) / 2, cy = (t[0].y + t[1].y) / 2;
      S.cam.s = clampS(gesture.s0 * d / gesture.d0);
      S.cam.x = gesture.g[0] - (cx - W / 2) / S.cam.s;
      S.cam.y = gesture.g[1] + (cy - H / 2) / S.cam.s;
      need(true);
    }
    return;
  }
  if (S.tool === 'weld' && weldView()) { brush.x = px; brush.y = py; if (!act) need(); }
  if (!act) {
    if (S.tool === 'cut' && S.view === 'prov' && cut.pts.length) { cut.hover = [wx, wy]; need(); }
    else if (S.tool === 'poly' && S.view === 'prov' && pdraw.pts.length) { pdraw.hover = snapVertex(wx, wy) || [wx, wy]; need(); }
    else if (S.tool === 'strait' && S.view === 'prov' && strait.a) { strait.hover = [wx, wy]; need(); }
    return;
  }
  switch (act.kind) {
    case 'bgmove': case 'bgresize': bgMove(wx, wy); break;
    case 'vrect': VX.rect = [act.x, act.y, wx, wy]; need(); break;
    case 'pan':
      S.cam.x -= (px - act.lx) / S.cam.s; S.cam.y += (py - act.ly) / S.cam.s; act.lx = px; act.ly = py; need(true); break;
    case 'cut': cutMove(px, py, wx, wy); break;
    case 'paint': paintMove(wx, wy); break;
    case 'weld': weldMove(wx, wy); need(); break;
    case 'brushdel': delCollect(wx, wy); break;
    case 'sdrag': act.st[act.end] = [wx, wy]; need(); break;
    case 'vdrag': {
      // accroche à un autre sommet (hors ceux qu'on déplace) : lâcher dessus = fusion
      const sn = snapExcluding(wx, wy, act.refs);
      act.snap = sn;
      const tx_ = sn ? sn[0] : wx, ty_ = sn ? sn[1] : wy;
      for (const f of act.refs) { f.r[f.i] = tx_; f.r[f.i + 1] = ty_; }
      act.moved = true;
      for (const id of act.provIds) { const p = S.provs.get(id); if (p) { p._path = null; p._bb = null; } }
      need(); break;
    }
  }
});

function endPointer(e) {
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const [wx, wy] = s2w(px, py);
  ptrs.delete(e.pointerId);
  if (gesture) { if ([...ptrs.values()].filter(p => p.type === 'touch').length < 2) { gesture = null; need(); } return; }
  if (!act) return;
  const a = act; act = null;
  cv.style.cursor = cursorFor();
  if (a.kind === 'pan') need();
  else if (a.kind === 'bgmove' || a.kind === 'bgresize') markDirty();
  else if (a.kind === 'vrect') vecRectDone();
  else if (a.kind === 'cut') { act = a; cutUp(px, py, wx, wy); act = null; }
  else if (a.kind === 'paint') { if (a.changed) a.tx.commit(); }
  else if (a.kind === 'brushdel') delFinish(a);
  else if (a.kind === 'sdrag') { straitTx(() => {}, a.before); need(); }
  else if (a.kind === 'weld') { if (a.tx.commit()) toast(a.n + (a.vdel ? ' sommets supprimés' : ' sommets fusionnés')); else toast(a.vdel ? 'Aucun sommet supprimable sous le pinceau' : 'Rien à fusionner sous le pinceau'); G.geomDirty = G.asgnDirty = true; need(); }
  else if (a.kind === 'vdrag') {
    G.dragB = null; G.geomDirty = G.asgnDirty = true;
    if (a.snap) { dedupeRings(a.provIds); toast('Sommets fusionnés'); }
    if (a.moved) a.tx.commit();
    for (const id of a.provIds) { const p = S.provs.get(id); if (p) { p._path = null; p._bb = null; } }
    need();
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); abortAct(); });
cv.addEventListener('contextmenu', e => e.preventDefault());

function abortAct() {
  if (!act) { gesture = null; return; }
  const a = act; act = null;
  if (a.kind === 'cut') cutReset();
  else if (a.kind === 'paint' && a.changed) a.tx.commit();
  else if (a.kind === 'sdrag') S.straits = JSON.parse(a.before);
  else if (a.kind === 'weld') applyEnts([...a.tx.before].map(([id, b]) => ({ id, before: b, after: null })), false);
  else if (a.kind === 'vdrag') { applyEnts([...a.tx.before].map(([id, b]) => ({ id, before: b, after: null })), false); G.dragB = null; }
  need();
}

const clampS = s => Math.max(0.4, Math.min(60000, s));
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const g = s2w(px, py);
  S.cam.s = clampS(S.cam.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)));
  S.cam.x = g[0] - (px - W / 2) / S.cam.s;
  S.cam.y = g[1] + (py - H / 2) / S.cam.s;
  wheelUntil = performance.now() + 220;
  need(true);
}, { passive: false });

function cursorFor() { return spaceDown || S.tool === 'hand' ? 'grab' : S.tool === 'select' ? 'default' : 'crosshair'; }

/* ===================================================================== clavier */
window.addEventListener('keydown', e => {
  if ($('#editor').hidden) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select') { if (e.key === 'Escape' || e.key === 'Enter') e.target.blur(); return; }
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); saveNow(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === ' ') { spaceDown = true; cv.style.cursor = 'grab'; e.preventDefault(); return; }
  if (k === 'escape') { cutReset(); if (strait.a) { strait.a = null; need(); } if (act) abortAct(); return; }
  if (k === 'enter') { if (S.tool === 'poly') polyFinish(); else cutFinish(); return; }
  if (k === 'l') { S.labels = !S.labels; need(); return; }
  if (k === 'o') { setWrap(!wrapOn); return; }
  if (k === '/') { e.preventDefault(); $('#search').focus(); return; }
  if (k === 'delete' || k === 'backspace') { if (S.view === 'prov') { if (S.tool === 'strait') straitDelete(); else deleteSel(); } return; }
  if (['1', '2', '3', '4', '5', '6', '7'].includes(k)) { setView(['prov', 'country', 'region', 'terrain', 'bg', 'air', 'naval'][+k - 1]); return; }
  if (k === 'z' && S.view === 'prov') { explodeSel(); return; }
  if (k === 'r' && S.view === 'prov') { setTool(S.tool === 'mergepart' ? 'select' : 'mergepart'); return; }
  if (k === 'x' && S.view === 'prov') { setTool(S.tool === 'detach' ? 'select' : 'detach'); return; }
  const map = S.view === 'prov'
    ? { a: 'select', c: 'cut', e: 'merge', d: 'vertex', w: 'weld', s: 'snap', p: 'poly', j: 'strait', h: 'hand' }
    : S.view === 'bg' ? { b: 'bgmove', i: 'vec', h: 'hand' }
    : S.view === 'terrain' ? { t: 'paint', i: 'pipette', h: 'hand', a: 'paint' }
    : S.view === 'air' || S.view === 'naval' ? { a: 'assign', i: 'pipette', h: 'hand' }
    : { a: 'assign', w: 'weld', i: 'pipette', h: 'hand' };
  if (map[k]) { setTool(map[k]); return; }
  if (weldView() && S.tool === 'weld' && (k === '[' || k === ']')) { brush.r = Math.max(4, Math.min(120, Math.round(brush.r * (k === ']' ? 1.25 : 0.8)))); syncUI(); need(); return; }
  if (S.view === 'terrain' && (k === '[' || k === ']')) { S.pen = (S.pen + (k === ']' ? 1 : TERRAINS.length - 1)) % TERRAINS.length; syncUI(); }
});
window.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; cv.style.cursor = cursorFor(); } });
window.addEventListener('resize', resize);

function setView(v) {
  S.view = v; cutReset();
  S.tool = TOOLS[v][0][0];
  syncUI(); need();
}
function setTool(t) { if (!(S.view === 'prov' && (t === 'fill' || t === 'detach' || t === 'mergepart')) && !TOOLS[S.view].some(x => x[0] === t)) return; S.tool = t; cutReset(); syncUI(); need(); cv.style.cursor = cursorFor(); }

function syncUI() {
  // vues
  $('#views').innerHTML = VIEWS.map(([k, n], i) => `<button data-v="${k}" class="${S.view === k ? 'on' : ''}" title="${i + 1}">${n}</button>`).join('');
  for (const b of $('#views').children) b.onclick = () => setView(b.dataset.v);
  // outils
  $('#tools').innerHTML = TOOLS[S.view].map(([k, ic, n, key]) => `<button data-t="${k}" class="${S.tool === k ? 'on' : ''}" title="${n} (${key})"><i>${ic}</i><small>${n}</small></button>`).join('')
    + (S.view === 'prov' ? '<hr><button id="bExplode" title="Éclater en parties (Z)"><i>✺</i><small>Éclater</small></button><button id="bDetach" class="' + (S.tool === 'detach' ? 'on' : '') + '" title="Détacher une seule partie (X)"><i>✂️</i><small>Détacher</small></button><button id="bMergePart" class="' + (S.tool === 'mergepart' ? 'on' : '') + '" title="Fusionner seulement le morceau cliqué (R)"><i>🧩</i><small>Fusion morceau</small></button><button id="bDel" title="Supprimer (Suppr)"><i>🗑</i><small>Suppr.</small></button><button id="bOcean" title="Générer les mers/océans (complément des terres)"><i>🌊</i><small>Océans</small></button><button id="bFill" class="' + (S.tool === 'fill' ? 'on' : '') + '" title="Remplir une zone vide d’un clic"><i>🪣</i><small>Remplir</small></button>' : '');
  for (const b of $('#tools').querySelectorAll('[data-t]')) b.onclick = () => setTool(b.dataset.t);
  if ($('#bExplode')) { $('#bExplode').onclick = explodeSel; $('#bDetach').onclick = () => setTool(S.tool === 'detach' ? 'select' : 'detach'); $('#bMergePart').onclick = () => setTool(S.tool === 'mergepart' ? 'select' : 'mergepart'); $('#bDel').onclick = deleteSel; $('#bOcean').onclick = generateOcean; $('#bFill').onclick = () => setTool(S.tool === 'fill' ? 'select' : 'fill'); }
  $('#bUndo').disabled = !S.undo.length; $('#bRedo').disabled = !S.redo.length;
  $('#hint').textContent = HINTS[S.view + ':' + S.tool] || '';
  $('#hint').hidden = !$('#hint').textContent;
  renderPanel();
}

function opts(list, cur, none) {
  return (none ? `<option value="0">${none}</option>` : '') + list.map(o => `<option value="${o.id}" ${o.id === cur ? 'selected' : ''}>${esc(o.name)}</option>`).join('');
}
const byName = m => [...m.values()].sort((a, b) => a.name.localeCompare(b.name));

      <div class="kv">${p.polys.length} partie${p.polys.length > 1 ? 's' : ''} · ${nv} sommets</div>`;
    const edit = (fn) => { const tx = new Tx(); tx.touch(p); fn(); tx.commit(); G.asgnDirty = true; need(); };
    $('#pName').onchange = e => edit(() => { p.name = e.target.value.trim() || p.name; });
    $('#pCountry').onchange = e => edit(() => { p.country = +e.target.value; });
    $('#pRegion').onchange = e => edit(() => { p.region = +e.target.value; });
    $('#pTerr').onchange = e => edit(() => { p.terrain = +e.target.value; });

      <div class="row"><button id="cDel" class="danger">Supprimer ${isC ? 'ce pays' : 'cette région'}</button></div>` : ''}

      ${S.tool === 'weld' ? `<h3>Pinceau</h3><div class="row"><label>Action</label><select id="wMode"><option value="weld" ${brush.mode !== 'vdel' ? 'selected' : ''}>Fusionner les sommets</option><option value="vdel" ${brush.mode === 'vdel' ? 'selected' : ''}>Supprimer des sommets</option></select></div><div class="row"><label>Rayon</label><input type="range" id="wRad" min="4" max="120" value="${brush.r}"><span class="kv" id="wRadV">${brush.r}px</span></div>` : ''}`;
    $('#cSel').onchange = e => { if (isC) S.actC = +e.target.value; else S.actR = +e.target.value; syncUI(); };

        if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Confirmer la suppression'; return; }
        const tx = new Tx();
        for (const p of S.provs.values()) if ((isC ? p.country : p.region) === cur.id) { tx.touch(p); if (isC) p.country = 0; else p.region = 0; }

    for (const row of el.querySelectorAll('.bgrow')) {

      row.querySelector('[data-a=down]').onclick = () => { if (i > 0) { [S.bg[i], S.bg[i - 1]] = [S.bg[i - 1], S.bg[i]]; if (S.bgSel === i) S.bgSel = i - 1; markDirty(); syncUI(); need(); } };
      row.querySelector('[data-a=del]').onclick = () => { S.bg.splice(i, 1); S.bgSel = Math.min(S.bgSel, S.bg.length - 1); markDirty(); syncUI(); need(); };

  }

/* ===================================================================== export */
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function exportAll() {
  const r6 = v => Math.round(v * 1e6) / 1e6;
  const ringOut = (r, ccw) => {
    const pts = [];
    for (let i = 0; i < r.length; i += 2) pts.push([r6(r[i]), r6(r[i + 1])]);
    if ((C.ringArea(r) > 0) !== ccw) pts.reverse();
    pts.push(pts[0].slice());
    return pts;
  };
  const polysOut = p => p.polys.map(poly => poly.map((r, i) => ringOut(r, i === 0)));
  const provs = [...S.provs.values()].sort((a, b) => a.id - b.id);
  const typeOf = p => p.terrain === NOT_SET ? 'land' : TERRAINS[p.terrain][2];
  const provJson = {
    format: 1, projection: 'equirectangular', unit: 'degrees', coordinates: '[lon, lat]',
    terrains: TERRAINS.map((t, i) => ({ id: i, name: t[0], type: t[2], color: t[1] })),
    provinces: provs.map(p => {
      const bb = bbOf(p);
      return { id: p.id, name: p.name, color: p.color, country: p.country, region: p.region,
        terrain: p.terrain === NOT_SET ? null : p.terrain, type: typeOf(p), bbox: bb.map(r6), polygons: polysOut(p),
        ...(p.vp ? { vp: p.vp } : {}), ...(p.cap ? { cap: p.cap } : {}) };
    }),
  };
  const geo = {
    type: 'FeatureCollection',
    features: provs.map(p => ({ type: 'Feature',
      properties: { id: p.id, name: p.name, country: p.country, region: p.region, terrain: p.terrain === NOT_SET ? null : TERRAINS[p.terrain][0], type: typeOf(p) },
      geometry: { type: 'MultiPolygon', coordinates: polysOut(p) } })),
  };
  // régions : pays déduit (majoritaire)
  const rmap = new Map();
  for (const p of provs) if (p.region) { if (!rmap.has(p.region)) rmap.set(p.region, []); rmap.get(p.region).push(p); }
  const regions = [...rmap].map(([rid, ps]) => {
    const r = S.regions.get(rid) || { name: 'Région ' + rid, color: '#888', pop: 0, notes: '' };
    const cnt = new Map(); for (const p of ps) cnt.set(p.country, (cnt.get(p.country) || 0) + 1);
    const country = [...cnt].sort((a, b) => b[1] - a[1])[0][0];
    return { id: rid, name: r.name, country, color: r.color, population: r.pop || 0, notes: r.notes || '', provinces: ps.map(p => p.id) };
  });
  const countries = [...S.countries.values()].map(c => ({
    id: c.id, name: c.name, tag: c.tag || '', color: c.color,
    regions: regions.filter(r => r.country === c.id).map(r => r.id),
    provinces: provs.filter(p => p.country === c.id).map(p => p.id),
  })).filter(c => c.provinces.length);
  const enc = new TextEncoder(), j = o => enc.encode(JSON.stringify(o));
  const date = new Date().toISOString().slice(0, 10), dir = 'bopvec_export_' + date + '/';
  const zip = C.makeZip([
    { name: dir + 'provinces.json', data: j(provJson) },
    { name: dir + 'provinces.geojson', data: j(geo) },
    { name: dir + 'regions.json', data: j({ regions }) },
    { name: dir + 'countries.json', data: j({ countries }) },
    ...(S.straits.length || S.straitsFromHoi4 ? [{ name: dir + 'adjacencies.json', data: j(straitExport()) }] : []),   // détroits -> data/adjacencies.json du jeu
    ...(S.zones.size ? [{ name: dir + 'airzones.json', data: j(airExport(provs)) }] : []),   // zones aériennes -> data/airzones.json du jeu
  ]);
  download('bopvec_export_' + date + '.zip', new Blob([zip], { type: 'application/zip' }));
  const issues = bilan().filter(c => c.warn && c.items.length).map(c => c.items.length + ' ' + c.t.toLowerCase());
  toast('Export : ' + provs.length + ' provinces, ' + regions.length + ' régions, ' + countries.length + ' pays'
    + (issues.length ? ' — attention : ' + issues.join(', ') + ' (menu → Bilan)' : ''));
}

/* ===================================================================== cloud GitHub
   Sauvegarde des projets dans un dépôt GitHub (privé de préférence) : saves/<nom>.bopvec.gz.
   Réglages (dépôt, branche, jeton) gardés dans localStorage de CET appareil ; le jeton ne part
   que vers api.github.com. Le projet est identifié par son nom cloud + le sha de la dernière
   version synchronisée : un conflit (autre appareil entre-temps) n'écrase jamais en silence. */
const CLOUD = {
  load() { try { return JSON.parse(localStorage.getItem('bopvec.cloud') || 'null'); } catch (_) { return null; } },
  store(c) { try { localStorage.setItem('bopvec.cloud', JSON.stringify(c)); return true; } catch (_) { return false; } },
  busy: false, timer: 0,
};
const slugify = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'projet';
const cloudReady = () => { const c = CLOUD.load(); return !!(c && c.repo && c.token); };

async function gzipStr(str) {
  const cs = new CompressionStream('gzip'), w = cs.writable.getWriter();
  w.write(new TextEncoder().encode(str)); w.close();
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}
async function gunzipBuf(buf) {
  const ds = new DecompressionStream('gzip'), w = ds.writable.getWriter();
  w.write(buf); w.close();
  return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
}
function toB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

function ghFetch(path, opt = {}) {
  const c = CLOUD.load();
  const base = (c.api || 'https://api.github.com').replace(/\/$/, '');
  const headers = {
    Authorization: 'Bearer ' + c.token,
    Accept: opt.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
  };   // pas d'en-tête X-GitHub-Api-Version : un en-tête de moins à faire accepter par le CORS
  if (opt.body) headers['Content-Type'] = 'application/json';
  return fetch(base + '/repos/' + c.repo + path, { method: opt.method || 'GET', headers, body: opt.body });
}
const refQ = () => '?ref=' + encodeURIComponent((CLOUD.load().branch || 'main'));

async function cloudTest() {
  const r = await ghFetch('');
  if (r.status === 401) throw new Error('jeton refusé (401)');
  if (r.status === 404) throw new Error('dépôt introuvable ou jeton sans accès (404)');
  if (!r.ok) throw new Error('GitHub ' + r.status);
  const j = await r.json();
  if (j.permissions && !j.permissions.push) throw new Error('le jeton n’a pas le droit d’écrire (Contents : Read and write)');
  return j;
}

async function cloudList() {
  const r = await ghFetch('/contents/saves' + refQ());
  if (r.status === 404) return [];
  if (!r.ok) throw new Error('GitHub ' + r.status);
  const arr = await r.json();
  return arr.filter(f => f.type === 'file' && f.name.endsWith('.bopvec.gz'));
}

async function cloudPush(manual) {
  if (CLOUD.busy || !cloudReady() || !S.id) return false;
  CLOUD.busy = true;
  try {
    const c = CLOUD.load();
    if (!S.cloudName) S.cloudName = slugify(S.name);
    const path = '/contents/saves/' + encodeURIComponent(S.cloudName) + '.bopvec.gz';
    setSaved('☁ envoi…');
    const content = toB64(await gzipStr(JSON.stringify(serialize())));
    const put = sha => ghFetch(path, {
      method: 'PUT',
      body: JSON.stringify({ message: 'Sauvegarde « ' + S.name + ' » (' + S.provs.size + ' provinces)', content, branch: c.branch || 'main', ...(sha ? { sha } : {}) }),
    });
    let r = await put(S.cloudSha || undefined);
    if (r.status === 409 || r.status === 422 || r.status === 404) {
      const cur = await ghFetch(path + refQ());
      if (cur.ok) {
        const meta = await cur.json();
        if (!manual) {
          S.cloudConflict = true; setSaved('⚠ conflit cloud');
          toast('Le cloud contient une autre version de ce projet : ouvre ☰ → Cloud pour choisir.');
          return false;
        }
        if (!confirm('Le cloud contient une version différente de « ' + S.cloudName + ' » (autre appareil, ou autre projet du même nom).\nÉcraser le cloud avec cette version ?')) { setSaved('☁ envoi annulé'); return false; }
        r = await put(meta.sha);
      } else if (cur.status === 404) r = await put(undefined);
    }
    if (!r.ok) throw new Error(r.status === 401 ? 'jeton refusé' : r.status === 403 ? 'accès refusé (droits du jeton ?)' : 'GitHub ' + r.status);
    const j = await r.json();
    S.cloudSha = j.content.sha; S.cloudConflict = false;
    await saveNow(true);
    setSaved('☁ synchronisé ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }));
    return true;
  } catch (e) {
    setSaved('⚠ cloud : ' + e.message);
    if (manual) toast('Envoi cloud impossible : ' + e.message);
    return false;
  } finally { CLOUD.busy = false; }
}

function cloudSchedule() {
  const c = CLOUD.load();
  if (!c || !c.auto || !cloudReady() || S.cloudConflict || $('#editor').hidden) return;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(() => { if (drawing()) cloudSchedule(); else cloudPush(false); }, c.delay || 15000);
}

async function cloudCheck() {
  if (!S.cloudName || !cloudReady()) return;
  try {
    const r = await ghFetch('/contents/saves/' + encodeURIComponent(S.cloudName) + '.bopvec.gz' + refQ());
    if (!r.ok) return;
    const j = await r.json();
    if (j.sha !== S.cloudSha) { S.cloudConflict = true; setSaved('☁ version plus récente dans le cloud'); toast('Une autre version de ce projet existe dans le cloud (☰ → Cloud pour la récupérer).'); }
    else setSaved('☁ à jour');
  } catch (_) { /* hors ligne */ }
}

async function cloudOpen(item) {
  try {
    const existing = DB.db ? await DB.get('c_' + item.name.replace(/\.bopvec\.gz$/, '')).catch(() => null) : null;
    if (existing && !confirm('Une copie locale de ce projet existe sur cet appareil. La remplacer par la version du cloud ?')) return;
    busy(true, 'Téléchargement depuis GitHub…'); await tick();
    const r = await ghFetch('/contents/' + item.path.split('/').map(encodeURIComponent).join('/') + refQ(), { raw: true });
    if (!r.ok) throw new Error('GitHub ' + r.status);
    const d = JSON.parse(await gunzipBuf(new Uint8Array(await r.arrayBuffer())));
    deserialize(d);
    S.cloudName = item.name.replace(/\.bopvec\.gz$/, ''); S.cloudSha = item.sha; S.cloudConflict = false;
    S.id = 'c_' + S.cloudName;
    busy(false); $('#dlg').hidden = true;
    openEditor(true);
    await saveNow(true);
    setSaved('☁ à jour');
  } catch (e) { busy(false); toast('Ouverture cloud impossible : ' + e.message); }
}

    <hr style="border:0;border-top:1px solid var(--line);margin:10px 0">
    ${inEditor ? `<div class="row"><button id="clPush">Envoyer « ${esc(S.name)} » maintenant</button></div>

  const refresh = async () => {
