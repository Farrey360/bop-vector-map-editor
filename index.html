    if (!CLOUD.store(n)) return msg('Impossible d’enregistrer les réglages (stockage du navigateur bloqué).', true);
    msg('Test…');
    try { const j = await cloudTest(); msg('Connexion OK : ' + j.full_name + (j.private ? ' (privé)' : ' — ATTENTION : dépôt PUBLIC, tes sauvegardes seraient visibles de tous'), j.private === false); S.cloudConflict = false; refresh(); }
    catch (e) { msg(e.message, true); }
  };
  if ($('#clPush')) $('#clPush').onclick = async () => { CLOUD.store(read()); msg('Envoi…'); const ok = await cloudPush(true); msg(ok ? 'Envoyé.' : 'Échec (voir le message en haut).', !ok);
    const st = $('#clState'); if (st && S.cloudSha) st.innerHTML = 'Nom cloud : <b>' + esc(S.cloudName) + '</b> · lié au cloud';
    setTimeout(refresh, 1500); };
  $('#clRefresh').onclick = refresh;
  $('#dlg').hidden = false;
  refresh();
}

/* ===================================================================== accueil / fichiers */
let toastT = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}
const busy = (on, msg) => { $('#busy').textContent = msg || 'Chargement…'; $('#busy').hidden = !on; };
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error(src + ' introuvable'));
    document.head.appendChild(s);
  });
}
const tick = () => new Promise(r => setTimeout(r, 30));

async function showHome() {
  $('#editor').hidden = true; $('#home').hidden = false;
  let list = [];
  try { list = (await DB.list()).sort((a, b) => b.updated - a.updated); } catch (e) { /* stockage indisponible */ }
  $('#projects').innerHTML = `
    <div class="card new" id="cNewNE"><div class="plus">＋</div><b>Nouveau projet</b><span>Monde Natural Earth 50 m (terres, pays déjà séparés)</span></div>
    <div class="card new" id="cCloud"><div class="plus">☁</div><b>Ouvrir depuis le cloud</b><span>Reprendre un projet sauvegardé sur GitHub</span></div>
    <div class="card new" id="cNewNE10"><div class="plus">＋</div><b>Nouveau — détaillé (10 m)</b><span>Côtes et petites îles précises, plus lourd à charger</span></div>
    <div class="card new" id="cImport"><div class="plus">⇪</div><b>Importer</b><span>.bopvec ou GeoJSON de ta carte</span></div>`
    + list.map(m => `<div class="card" data-id="${m.id}">${m.thumb ? `<img src="${m.thumb}" alt="">` : '<img alt="">'}<button class="x" title="Supprimer">×</button>
      <div class="meta"><b>${esc(m.name)}</b><span>${m.nProv} provinces · ${new Date(m.updated).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</span></div></div>`).join('');
  $('#cNewNE').onclick = async () => { busy(true); await tick(); loadNaturalEarth(); S.name = 'Monde ' + new Date().toLocaleDateString('fr-FR'); S.id = 'p' + Date.now().toString(36); busy(false); openEditor(true); markDirty(); };
  $('#cCloud').onclick = showCloud;
  $('#cNewNE10').onclick = async () => {
    busy(true, 'Chargement de la carte 10 m… (quelques secondes)'); await tick();
    try {
      if (!window.NE10_COUNTRIES) await loadScript('ne10.js');
      loadNaturalEarth(window.NE10_COUNTRIES);
      S.name = 'Monde 10 m ' + new Date().toLocaleDateString('fr-FR'); S.id = 'p' + Date.now().toString(36);
      busy(false); openEditor(true); markDirty();
    } catch (err) { busy(false); toast('Carte 10 m indisponible : ' + err.message + ' (lance tools/build-ne.js, voir README)'); }
  };
  $('#cImport').onclick = () => { $('#file').value = ''; $('#file').click(); };
  for (const c of $('#projects').querySelectorAll('.card[data-id]')) {
    c.onclick = async ev => {
      const id = c.dataset.id;
      if (ev.target.classList.contains('x')) {
        if (!confirm('Supprimer ce projet ?')) return;
        await DB.del(id); showHome(); return;
      }
      busy(true); await tick();
      const rec = await DB.get(id); deserialize(rec.data); S.id = id; busy(false); openEditor(true);
    };
  }
}

$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  busy(true); await tick();
  try {
    const d = JSON.parse(await f.text());
    if (d.provinces && d.format) { deserialize(d); S.name = d.name || f.name.replace(/\.\w+$/, ''); }
    else if (d.features) { loadGeoJSON(d); S.name = f.name.replace(/\.\w+$/, ''); }
    else throw new Error('Format inconnu');
    S.id = 'p' + Date.now().toString(36);
    busy(false); openEditor(true); markDirty();
  } catch (err) { busy(false); toast('Import impossible : ' + err.message); }
};

function openEditor(fit) {
  $('#home').hidden = true; $('#editor').hidden = false;
  S.view = 'prov'; S.tool = 'select'; S.sel = 0; S.dirty = false; setSaved('');
  $('#pname').value = S.name;
  G.geomDirty = G.asgnDirty = true;
  resize();
  if (fit) fitView();
  syncUI(); need();
  cloudCheck();
}

/* ===================================================================== démarrage */
(async function init() {
  try {
    await Promise.race([DB.open(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 2500))]);
  } catch (e) { DB.db = null; console.warn('IndexedDB indisponible', e); }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeunload', ev => { if (S.dirty && DB.db) { saveNow(); } });
  showHome();
})();
</script>
